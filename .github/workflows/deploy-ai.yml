name: Deploy AI Service (FastAPI → Fly.io)

on:
  push:
    branches: [main]
    paths:
      - 'apps/ai-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config infra/fly/ai-service.fly.toml --remote-only --app querencia-ai
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
