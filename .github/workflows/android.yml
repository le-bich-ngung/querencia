name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: pnpm/action-setup@v3
        with: {version: 9}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}

      - name: Install
        run: pnpm install
        working-directory: .

      - name: Build and Force Patch
        run: |
          # 1. Build xong trước
          gradle assembleDebug --no-daemon
          
          # 2. Tìm tất cả các file libhermes.so và copy thành libhermes_executor.so
          # Đây là cách đảm bảo 100% file nằm đúng chỗ trong các thư mục con
          find . -name "libhermes.so" | while read -r lib; do
            target=$(echo "$lib" | sed 's/libhermes.so/libhermes_executor.so/')
            if [ ! -f "$target" ]; then
              cp "$lib" "$target"
              echo "Force copied: $target"
            fi
          done
          
          # 3. Đóng gói lại lần cuối
          gradle packageDebug --no-daemon
        working-directory: apps/cui-bap-mobile/android

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/cui-bap-mobile/android/app/build/outputs/apk/debug/app-debug.apk