name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Force Fix Gradle Wrapper
        working-directory: apps/cui-bap-mobile/android
        run: |
          mkdir -p gradle/wrapper
          
          # Tải lại file từ URL chính thức của Gradle (phiên bản 8.7)
          # Sử dụng --retry 3 để đảm bảo tải thành công qua mạng
          curl -L --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle-8.7-bin.zip
          
          # Giải nén chỉ file jar cần thiết
          unzip -o gradle-8.7-bin.zip "gradle-8.7/gradle/wrapper/gradle-wrapper.jar" -d temp_gradle
          mv temp_gradle/gradle-8.7/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          
          # Dọn dẹp
          rm -rf gradle-8.7-bin.zip temp_gradle
          
          # Cấp quyền thực thi
          chmod +x gradlew
          chmod +x gradle/wrapper/gradle-wrapper.jar
          
      - name: Install dependencies
        run: pnpm install
        working-directory: .

      - name: Generate RN config
        run: |
          mkdir -p android/build
          npx react-native config > android/build/react-native-config.json
        working-directory: apps/cui-bap-mobile

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
        working-directory: apps/cui-bap-mobile

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon
        working-directory: apps/cui-bap-mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/cui-bap-mobile/android/app/build/outputs/apk/debug/app-debug.apk