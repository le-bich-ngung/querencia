name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install
        working-directory: .

      - name: Create Autolinking File
        run: |
          mkdir -p android/build/generated/autolinking
          cat <<EOF > android/build/generated/autolinking/autolinking.json
          {
            "dependencies": {},
            "project": {
              "android": {
                "packageName": "com.querencia.cuibap"
              }
            }
          }
          EOF
        working-directory: apps/cui-bap-mobile

      - name: Generate RN config
        run: |
          mkdir -p android/build
          npx react-native config > android/build/react-native-config.json
        working-directory: apps/cui-bap-mobile

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
        working-directory: apps/cui-bap-mobile

      - name: Rebuild Gradle Wrapper
        run: |
          rm -rf gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          curl -L "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ls -la gradle/wrapper/
        working-directory: apps/cui-bap-mobile/android

      - name: Build APK
        run: |
          ls -la gradle/wrapper/
          file gradle/wrapper/gradle-wrapper.jar
          ./gradlew assembleDebug --no-daemon
        working-directory: apps/cui-bap-mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/cui-bap-mobile/android/app/build/outputs/apk/debug/app-debug.apk