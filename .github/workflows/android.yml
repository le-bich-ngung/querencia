name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Gradle Wrapper
        working-directory: apps/cui-bap-mobile/android
        run: |
          # 1. Xóa file cũ/bị lỗi
          rm -rf gradle/wrapper/gradle-wrapper.jar
          
          # 2. Lấy version từ file properties
          VERSION=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties | cut -d'-' -f2)
          echo "Detected Gradle version: $VERSION"
          
          # 3. Tải lại wrapper chuẩn từ Gradle
          # Lưu ý: Lệnh này sẽ tự tạo lại file .jar chuẩn dựa trên phiên bản đã phát hiện
          ./gradlew wrapper --gradle-version $VERSION
          
          # 4. Cấp quyền thực thi
          chmod +x gradlew

      - name: Install dependencies
        run: pnpm install
        working-directory: .

      - name: Generate RN config
        run: |
          mkdir -p android/build
          npx react-native config > android/build/react-native-config.json
        working-directory: apps/cui-bap-mobile

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
        working-directory: apps/cui-bap-mobile

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon
        working-directory: apps/cui-bap-mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/cui-bap-mobile/android/app/build/outputs/apk/debug/app-debug.apk