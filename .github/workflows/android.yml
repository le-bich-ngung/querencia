name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install dependencies
        run: pnpm install
        working-directory: .

      - name: Generate RN config
        run: |
          mkdir -p android/build/generated/autolinking
          npx react-native config > android/build/react-native-config.json
          cp android/build/react-native-config.json android/build/generated/autolinking/autolinking.json
        working-directory: apps/cui-bap-mobile

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
        working-directory: apps/cui-bap-mobile

      - name: Build and Patch
        run: |
          # Build bước đầu để tạo file native
          gradle assembleDebug --no-daemon
          
          # Patch libhermes_executor
          MERGED_LIB=app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -f "$MERGED_LIB/$ABI/libhermes.so" ] && [ ! -f "$MERGED_LIB/$ABI/libhermes_executor.so" ]; then
              cp "$MERGED_LIB/$ABI/libhermes.so" "$MERGED_LIB/$ABI/libhermes_executor.so"
              echo "Copied libhermes_executor.so for $ABI"
            fi
          done
          
          # Đóng gói lại
          gradle packageDebug --no-daemon
        working-directory: apps/cui-bap-mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/cui-bap-mobile/android/app/build/outputs/apk/debug/app-debug.apk