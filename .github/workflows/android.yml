name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install
        working-directory: .

      - name: Create Autolinking File
        run: |
          mkdir -p android/build/generated/autolinking
          cat <<EOF > android/build/generated/autolinking/autolinking.json
          {
            "dependencies": {},
            "project": {
              "android": {
                "packageName": "com.querencia.cuibap"
              }
            }
          }
          EOF
        working-directory: apps/cui-bap-mobile

      - name: Build and Patch
        run: |
          # Cấp quyền thực thi cho gradlew
          chmod +x gradlew
          
          # Build app
          ./gradlew assembleDebug --no-daemon
          
          # Tìm và copy libhermes_executor.so tự động
          find . -name "libhermes.so" -exec sh -c '
            dir=$(dirname "$1")
            if [ ! -f "$dir/libhermes_executor.so" ]; then
              cp "$1" "$dir/libhermes_executor.so"
              echo "Patched: $dir/libhermes_executor.so"
            fi
          ' sh {} \;
          
          # Đóng gói lại
          ./gradlew packageDebug --no-daemon
        working-directory: apps/cui-bap-mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/cui-bap-mobile/android/app/build/outputs/apk/debug/app-debug.apk