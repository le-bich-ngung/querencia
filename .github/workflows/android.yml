name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: pnpm/action-setup@v3
        with: {version: 9}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}

      - name: Install dependencies
        run: pnpm install
        working-directory: .

      # TẠO FILE NGAY TẠI ĐÂY, TRƯỚC BẤT KỲ LỆNH GRADLE NÀO
      - name: Create Autolinking File
        run: |
          mkdir -p android/build/generated/autolinking
          echo '{"dependencies":{}}' > android/build/generated/autolinking/autolinking.json
        working-directory: apps/cui-bap-mobile

      - name: Build APK
        run: |
          # Build bình thường
          gradle assembleDebug --no-daemon
        working-directory: apps/cui-bap-mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/cui-bap-mobile/android/app/build/outputs/apk/debug/app-debug.apk