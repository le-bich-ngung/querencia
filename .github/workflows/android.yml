name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install
        working-directory: .

      - name: Create Autolinking File
        run: |
          mkdir -p android/build/generated/autolinking
          cat <<EOF > android/build/generated/autolinking/autolinking.json
          {
            "dependencies": {},
            "project": {
              "android": {
                "packageName": "com.querencia.cuibap"
              }
            }
          }
          EOF
        working-directory: apps/cui-bap-mobile

      - name: Rebuild Gradle Wrapper
        run: |
          # 1. Xóa file cũ bị hỏng
          rm -rf gradle/wrapper/gradle-wrapper.jar
          
          # 2. Tải lại file chuẩn từ GitHub của chính dự án Gradle
          mkdir -p gradle/wrapper
          curl -L "https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          
          # 3. Đảm bảo quyền thực thi
          chmod +x gradlew
        working-directory: apps/cui-bap-mobile/android

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon
        working-directory: apps/cui-bap-mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/cui-bap-mobile/android/app/build/outputs/apk/debug/app-debug.apk