name: Deploy API (NestJS → Fly.io)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
  workflow_dispatch: {}  # allows manual "Run workflow" / `gh workflow run`

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # FLY_API_TOKEN confirmed present in repo secrets (2026-08-22)
      - run: flyctl deploy --config infra/fly/api.fly.toml --remote-only --app querencia
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
