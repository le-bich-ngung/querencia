<!-- FILE: pages/tools.html -->
<section class="section" id="tools">
<style>
/* ── Tools page — dùng design system tokens từ main.css ── */
#tools {
  background: var(--white);
  min-height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
}

/* HEADER */
.tl-header {
  padding: 52px 56px 40px;
  border-bottom: 1px solid var(--border);
  background: var(--white);
}
.tl-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--sage);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tl-label::before {
  content: '';
  width: 24px;
  height: 2px;
  background: var(--sage);
  border-radius: 1px;
  display: inline-block;
}
.tl-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 3.5vw, 3rem);
  font-weight: 700;
  letter-spacing: -.03em;
  line-height: 1.1;
  color: var(--black);
  margin-bottom: 14px;
}
.tl-title em { font-style: italic; color: var(--sage); }
.tl-desc {
  font-size: 14px;
  color: var(--gray);
  max-width: 480px;
  line-height: 1.75;
}
.tl-header-meta {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 24px;
  flex-wrap: wrap;
}
.tl-meta-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--gray-light);
}
.tl-meta-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--sage);
  opacity: .5;
}

/* FILTER BAR */
.tl-filter-bar {
  padding: 16px 56px;
  border-bottom: 1px solid var(--border);
  background: var(--white);
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  position: sticky;
  top: 64px;
  z-index: 10;
}
.tl-filter-bar::-webkit-scrollbar { display: none; }

.tl-cat-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  color: var(--gray);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.tl-cat-btn:hover { border-color: var(--sage); color: var(--sage-dark); }
.tl-cat-btn.active {
  background: var(--sage-pale);
  border-color: var(--sage);
  color: var(--sage-dark);
  font-weight: 600;
}
.tl-cat-count {
  font-size: 10px;
  background: var(--sage);
  color: #fff;
  padding: 1px 5px;
  border-radius: 8px;
  font-weight: 700;
}
.tl-cat-btn.active .tl-cat-count { background: var(--sage-dark); }

/* GRID SECTION */
.tl-section { padding: 32px 56px 8px; }
.tl-section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 20px;
}
.tl-section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gray-light);
}
.tl-section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* TOOL CARDS GRID */
.tl-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

/* TOOL CARD */
.tl-card {
  position: relative;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 0;
  transition: border-color .2s, transform .18s, box-shadow .2s;
  overflow: hidden;
}
.tl-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 60%, rgba(74,124,89,.03));
  pointer-events: none;
}
.tl-card:hover {
  border-color: var(--sage);
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(74,124,89,.12);
}
.tl-card.coming {
  opacity: .5;
  cursor: default;
  pointer-events: none;
}
.tl-card.coming:hover { transform: none; box-shadow: none; border-color: var(--border); }

.tl-card-top {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 12px;
}
.tl-card-icon {
  width: 44px; height: 44px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 1.3rem;
}
.tl-card-meta { flex: 1; min-width: 0; }
.tl-card-name {
  font-weight: 700;
  font-size: 14px;
  color: var(--black);
  line-height: 1.3;
  margin-bottom: 5px;
  letter-spacing: -.01em;
}
.tl-card-desc {
  font-size: 12px;
  color: var(--gray);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.tl-card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.tl-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 6px;
}
.tl-badge-free { background: var(--sage-pale); color: var(--sage-dark); }
.tl-badge-pro  { background: #1a56db; color: #fff; }
.tl-badge-soon { background: #f1f5f9; color: #94a3b8; }
.tl-badge-new  { background: var(--sage); color: #fff; }

.tl-arrow {
  font-size: 14px;
  color: var(--gray-light);
  transition: transform .2s, color .2s;
}
.tl-card:not(.coming):hover .tl-arrow { transform: translateX(4px); color: var(--sage); }

/* COMING SOON BADGE */
.tl-soon-tag {
  position: absolute;
  top: 14px; right: 14px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--gray-light);
  background: var(--border);
  padding: 2px 7px;
  border-radius: 4px;
}

/* MORE SECTION */
.tl-more {
  padding: 32px 56px 48px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.tl-more-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 18px;
  background: var(--sage-pale);
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  color: var(--sage-dark);
  letter-spacing: .02em;
}
.tl-more-text {
  font-size: 12px;
  color: var(--gray-light);
}

/* DARK MODE */
body.dark #tools { background: #0f0f0f; }
body.dark .tl-header { background: #0f0f0f; }
body.dark .tl-filter-bar { background: #0f0f0f; }
body.dark .tl-card { background: #161b17; border-color: #232d25; }
body.dark .tl-card:hover { border-color: #4a7c59; box-shadow: 0 8px 28px rgba(74,124,89,.2); }
body.dark .tl-card-name { color: #e8e8e8; }
body.dark .tl-card::before { background: linear-gradient(135deg, transparent 60%, rgba(74,124,89,.06)); }
body.dark .tl-cat-btn { background: #0f0f0f; border-color: #232d25; color: #888; }
body.dark .tl-cat-btn.active { background: #1a3328; border-color: #4a7c59; color: #7ecf9a; }
body.dark .tl-card-foot { border-top-color: #232d25; }
body.dark .tl-badge-free { background: #1a3328; color: #7ecf9a; }
body.dark .tl-badge-soon { background: #1a1a1a; color: #555; }
body.dark .tl-more-pill { background: #1a3328; color: #7ecf9a; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .tl-header, .tl-filter-bar, .tl-section, .tl-more { padding-left: 24px; padding-right: 24px; }
  .tl-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}
@media (max-width: 600px) {
  .tl-header { padding: 28px 16px 24px; }
  .tl-filter-bar { padding: 12px 16px; }
  .tl-section { padding: 24px 16px 8px; }
  .tl-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .tl-card { padding: 14px; }
  .tl-more { padding: 20px 16px 32px; }
}
@media (max-width: 400px) {
  .tl-grid { grid-template-columns: 1fr; }
}
</style>

<div style="flex:1;overflow-y:auto">

  <!-- HEADER -->
  <div class="tl-header">
    <div class="tl-label">Querencia Tools</div>
    <h1 class="tl-title" data-i18n="tools_title">Tools <em>for you</em></h1>
    <p class="tl-desc">Công cụ xử lý ảnh, AI, chuyển đổi dữ liệu — chạy ngay trên trình duyệt, không cần cài đặt, không upload server.</p>
    <div class="tl-header-meta">
      <div class="tl-meta-item"><div class="tl-meta-dot"></div>100% client-side</div>
      <div class="tl-meta-item"><div class="tl-meta-dot"></div>Không quảng cáo</div>
      <div class="tl-meta-item"><div class="tl-meta-dot"></div><span id="tlToolCount">8</span> tools có sẵn</div>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="tl-filter-bar">
    <button class="tl-cat-btn active" data-cat="all" onclick="tlFilter('all', this)">
      Tất cả <span class="tl-cat-count" id="tlCountAll">8</span>
    </button>
    <button class="tl-cat-btn" data-cat="image" onclick="tlFilter('image', this)">
      Ảnh <span class="tl-cat-count" id="tlCountImage">6</span>
    </button>
    <button class="tl-cat-btn" data-cat="ai" onclick="tlFilter('ai', this)">
      AI <span class="tl-cat-count" id="tlCountAi">1</span>
    </button>
    <button class="tl-cat-btn" data-cat="converter" onclick="tlFilter('converter', this)">
      Chuyển đổi <span class="tl-cat-count" id="tlCountConverter">1</span>
    </button>
  </div>

  <!-- AVAILABLE NOW -->
  <div class="tl-section" id="tlSectionAvailable">
    <div class="tl-section-head">
      <span class="tl-section-title">Available now</span>
      <div class="tl-section-line"></div>
    </div>
    <div class="tl-grid" id="tlGrid"></div>
  </div>

  <!-- COMING SOON -->
  <div class="tl-section" id="tlSectionSoon" style="display:none">
    <div class="tl-section-head">
      <span class="tl-section-title">Coming soon</span>
      <div class="tl-section-line"></div>
    </div>
    <div class="tl-grid" id="tlGridSoon"></div>
  </div>

  <!-- MORE -->
  <div class="tl-more">
    <div class="tl-more-pill">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Thêm tools đang phát triển
    </div>
    <span class="tl-more-text">Cập nhật thường xuyên</span>
  </div>

</div>

<script>
(function() {
  // ── Data ──
  const TOOLS = [
    {
      id: 'image-editor',
      name: 'Image Editor',
      desc: 'Chỉnh sửa ảnh nâng cao, kho ảnh Unsplash miễn phí.',
      category: 'image',
      icon: '🎨',
      iconBg: '#e8f2ec',
      badge: 'free',
      badgeLabel: 'Free',
      href: '/pages/image-editor.html',
      available: true,
      isNew: false,
    },
    {
      id: 'compress-image',
      name: 'Compress Image',
      desc: 'Giảm dung lượng ảnh đến 80% — không mất chất lượng.',
      category: 'image',
      icon: '📦',
      iconBg: '#fef3e2',
      badge: 'free',
      badgeLabel: 'Free',
      href: '/pages/compress-image.html',
      available: true,
      isNew: false,
    },
    {
      id: 'resize-image',
      name: 'Resize Image',
      desc: 'Thay đổi kích thước theo pixel, phần trăm, hay preset mạng xã hội.',
      category: 'image',
      icon: '↔️',
      iconBg: '#e8eeff',
      badge: 'free',
      badgeLabel: 'Free',
      href: '/pages/resize-image.html',
      available: true,
      isNew: false,
    },
    {
      id: 'crop-image',
      name: 'Crop Image',
      desc: 'Cắt ảnh tự do hoặc theo tỷ lệ chuẩn 1:1, 16:9, passport...',
      category: 'image',
      icon: '✂️',
      iconBg: '#f3e8ff',
      badge: 'free',
      badgeLabel: 'Free',
      href: '/pages/crop-image.html',
      available: true,
      isNew: false,
    },
    {
      id: 'rotate-image',
      name: 'Rotate Image',
      desc: 'Xoay, flip, góc tự do — preview trực tiếp.',
      category: 'image',
      icon: '🔄',
      ironBg: '#e8f8ff',
      iconBg: '#e8f8ff',
      badge: 'free',
      badgeLabel: 'Free',
      href: '/pages/rotate-image.html',
      available: true,
      isNew: true,
    },
    {
      id: 'add-watermark',
      name: 'Add Watermark',
      desc: 'Thêm text hoặc logo watermark, tùy chỉnh vị trí và độ mờ.',
      category: 'image',
      icon: '🛡️',
      iconBg: '#fff0f6',
      badge: 'free',
      badgeLabel: 'Free',
      href: '/pages/add-watermark.html',
      available: true,
      isNew: true,
    },
    {
      id: 'convert-image',
      name: 'Convert Image',
      desc: 'Chuyển đổi giữa JPG, PNG, WEBP, GIF, BMP, ICO tức thì.',
      category: 'converter',
      icon: '🔁',
      iconBg: '#fff8e1',
      badge: 'free',
      badgeLabel: 'Free',
      href: '/pages/convert-image.html',
      available: true,
      isNew: true,
    },
    {
      id: 'smart-table-extractor',
      name: 'Smart Table Extractor',
      desc: 'AI trích xuất bảng từ ảnh, PDF, HTML. Xuất Excel, CSV, JSON.',
      category: 'ai',
      icon: '🤖',
      iconBg: '#e8f0ff',
      badge: 'pro',
      badgeLabel: 'Pro',
      href: '/pages/smart-table-extractor.html',
      available: true,
      isNew: true,
    },
    // Coming soon
    {
      id: 'pdf-tools',
      name: 'PDF Tools',
      desc: 'Merge, split, compress, convert PDF.',
      category: 'converter',
      icon: '📄',
      iconBg: '#ffe8e8',
      badge: 'soon',
      badgeLabel: 'Soon',
      href: null,
      available: false,
    },
    {
      id: 'bg-remover',
      name: 'Background Remover',
      desc: 'AI tự động xóa nền ảnh.',
      category: 'ai',
      icon: '✨',
      iconBg: '#f0e8ff',
      badge: 'soon',
      badgeLabel: 'Soon',
      href: null,
      available: false,
    },
  ];

  // ── State ──
  let activeCategory = 'all';

  // ── Render ──
  function render() {
    const available  = TOOLS.filter(t => t.available && (activeCategory === 'all' || t.category === activeCategory));
    const comingSoon = TOOLS.filter(t => !t.available && (activeCategory === 'all' || t.category === activeCategory));

    document.getElementById('tlGrid').innerHTML = available.map(cardHTML).join('');
    document.getElementById('tlGridSoon').innerHTML = comingSoon.map(cardHTML).join('');
    document.getElementById('tlSectionSoon').style.display = comingSoon.length ? '' : 'none';

    // Update counts
    updateCounts();
  }

  function cardHTML(t) {
    const badgeClass = { free: 'tl-badge-free', pro: 'tl-badge-pro', soon: 'tl-badge-soon', new: 'tl-badge-new' }[t.badge] || 'tl-badge-free';
    const newBadge = t.isNew ? `<span class="tl-badge tl-badge-new" style="margin-left:4px">New</span>` : '';
    return `
      <a class="tl-card${!t.available ? ' coming' : ''}"
        href="${t.href || '#'}"
        onclick="${t.href ? '' : 'return false'}">
        ${!t.available ? '<span class="tl-soon-tag">Em đang nấu</span>' : ''}
        <div class="tl-card-top">
          <div class="tl-card-icon" style="background:${t.iconBg}">${t.icon}</div>
          <div class="tl-card-meta">
            <div class="tl-card-name">${t.name}</div>
            <div class="tl-card-desc">${t.desc}</div>
          </div>
        </div>
        <div class="tl-card-foot">
          <div style="display:flex;gap:4px;align-items:center">
            <span class="tl-badge ${badgeClass}">${t.badgeLabel}</span>
            ${newBadge}
          </div>
          <span class="tl-arrow">→</span>
        </div>
      </a>`;
  }

  function updateCounts() {
    const avail = TOOLS.filter(t => t.available);
    document.getElementById('tlToolCount').textContent = avail.length;
    document.getElementById('tlCountAll').textContent = avail.length;
    document.getElementById('tlCountImage').textContent = avail.filter(t => t.category === 'image').length;
    document.getElementById('tlCountAi').textContent = avail.filter(t => t.category === 'ai').length;
    document.getElementById('tlCountConverter').textContent = avail.filter(t => t.category === 'converter').length;
  }

  // ── Filter ──
  window.tlFilter = function(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll('.tl-cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };

  // ── Init ──
  render();
})();
</script>
</section>
