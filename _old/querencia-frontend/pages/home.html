<section class="section active" id="home">
  <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column">
    <div class="hero">
      <h1 style="display:flex;align-items:center;justify-content:center;letter-spacing:-2px;font-family:var(--font-display);font-size:clamp(3rem,7vw,6rem);font-weight:700;line-height:1">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" style="width:1.1em;height:1.1em;flex-shrink:0;position:relative;top:0.15em;margin-right:-0.22em">
          <defs><clipPath id="qClipHero"><circle cx="55" cy="55" r="32"/></clipPath></defs>
          <circle cx="55" cy="55" r="38" fill="none" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
          <line x1="81" y1="79" x2="98" y2="98" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
          <polyline points="20,55 28,38 35,68 43,32 51,60 58,43 66,70 74,48 90,55" fill="none" stroke="#4a7c59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#qClipHero)"/>
        </svg>
        <span class="ueren-text" style="color:var(--black)">ueren</span><span style="color:#4a7c59">cia</span>
      </h1>
      <p class="hero-quote" style="white-space:nowrap;overflow:visible;max-width:none">
        <span id="home-typewriter"></span><span id="home-cursor" style="display:inline-block;width:2px;height:1em;background:#4a7c59;margin-left:2px;vertical-align:text-bottom;animation:home-blink 1s infinite"></span>
      </p>
    </div>
    <div class="whats-new-section">
      <p class="whats-new-label" data-i18n="whats_new">What's new</p>
      <div class="whats-new-empty">
        <p data-i18n="nothing_yet">Nothing yet. Check back soon.</p>
      </div>
    </div>
  </div>
</section>

<style>
@keyframes home-blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
</style>

<script>
(function(){
  const text = "It's not that the world is too dark but that we've grown used to not lighting ourselves up.";
  const el = document.getElementById('home-typewriter');
  const cursor = document.getElementById('home-cursor');
  if(!el) return;
  let i = 0, deleting = false;
  function tick(){
    if(!deleting){
      el.textContent = text.slice(0, ++i);
      if(i === text.length){
        // pause 4s then delete
        setTimeout(()=>{ deleting=true; tick(); }, 4000);
        return;
      }
      setTimeout(tick, 55);
    } else {
      el.textContent = text.slice(0, --i);
      if(i === 0){
        deleting = false;
        setTimeout(tick, 600);
        return;
      }
      setTimeout(tick, 28);
    }
  }
  setTimeout(tick, 800);
})();
</script>
