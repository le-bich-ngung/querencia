<!-- ============================================================
     FILE: pages/cuibap.html
     SECTION: #cuibap
     Được load vào index.html qua fetch() khi người dùng click nav
     ============================================================ -->
<section class="section" id="cuibap" style="padding:0">

<!-- LANDING PAGE -->
<div id="cbLanding" style="display:flex;flex-direction:column;flex:1;padding-top:64px">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:12px">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="72" height="72">
        <defs><clipPath id="qClipCB"><circle cx="55" cy="55" r="32"/></clipPath></defs>
        <circle cx="55" cy="55" r="38" fill="none" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
        <line x1="81" y1="79" x2="98" y2="98" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
        <polyline points="20,55 28,38 35,68 43,32 51,60 58,43 66,70 74,48 90,55" fill="none" stroke="#4a7c59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#qClipCB)"/>
      </svg>
    <h1 style="font-family:var(--font-display);font-size:clamp(2.5rem,6vw,5rem);font-weight:700;letter-spacing:-1px;color:#4a7c59;line-height:1;margin-top:12px">Cùi Bắp</h1>
    <p style="font-size:1rem;color:var(--gray);font-weight:400;margin-top:4px" data-i18n="cb_tagline">Message your friends.</p>
    
    
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px">
      <!-- Đã đăng nhập → nhập mã mở khóa. Chưa đăng nhập → đăng nhập -->
      <div id="cbLandingLoggedIn" style="display:none">
        <button onclick="cbShowPasscode()" style="padding:12px 28px;background:var(--sage);color:#fff;border:none;border-radius:24px;font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:10px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span data-i18n="cb_enter_passcode">Enter passcode</span>
        </button>
      </div>
      <div id="cbLandingLoggedOut" style="display:flex">
        <button onclick="openAuthModal('login')" style="padding:12px 32px;background:var(--sage);color:#fff;border:none;border-radius:24px;font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer" data-i18n="nav_login">Log in</button>
      </div>
    </div>
    <script>
    (function() {
      function updateCbLanding() {
        var token = localStorage.getItem('token');
        var li = document.getElementById('cbLandingLoggedIn');
        var lo = document.getElementById('cbLandingLoggedOut');
        if (li && lo) {
          li.style.display = token ? 'block' : 'none';
          lo.style.display = token ? 'none' : 'flex';
        }
      }
      updateCbLanding();
      window.addEventListener('storage', updateCbLanding);
    })();
    </script>
    </div>
    </div>
  </div>
  
</div>

<div id="cbApp" style="display:none;height:calc(100vh - 64px);overflow:hidden;background:var(--cb-bg)">

  <!-- SIDEBAR -->
  <div id="cbSidebar" style="width:300px;min-width:300px;border-right:1px solid var(--cb-border);display:flex;flex-direction:column;background:var(--cb-sidebar)">
    <div style="padding:16px;border-bottom:1px solid var(--cb-border);display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:1.1rem;font-weight:700;color:var(--sage)">🌽 Cùi Bắp</span>
      </div>
      <div style="display:flex;gap:6px">
        <button onclick="cbShowNewChat()" title="New message" style="background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--gray);font-size:1.1rem;transition:background 0.2s" onmouseover="this.style.background='var(--cb-hover)'" onmouseout="this.style.background='none'">✏️</button>
        <button onclick="cbShowNewGroup()" title="Create group" style="background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--gray);font-size:1.1rem;transition:background 0.2s" onmouseover="this.style.background='var(--cb-hover)'" onmouseout="this.style.background='none'">👥</button>
      </div>
    </div>
    <div style="padding:10px 16px">
      <div style="position:relative">
        <input id="cbSearch" type="text" placeholder="🔍 Search..." data-i18n-placeholder="search_placeholder" oninput="cbFilterConvs(this.value)"
          style="width:100%;padding:8px 12px;border:1.5px solid var(--cb-border);border-radius:20px;font-family:inherit;font-size:0.83rem;background:var(--cb-input);color:inherit;outline:none"/>
      </div>
    </div>
    <div style="display:flex;padding:0 16px 8px;gap:4px">
      <button id="cbTabChats" onclick="cbSetTab('chats')" style="flex:1;padding:6px;border:none;border-radius:8px;font-family:inherit;font-size:0.8rem;font-weight:600;cursor:pointer;background:var(--sage);color:#fff;transition:all 0.2s">💬 Chats</button>
      <button id="cbTabGroups" onclick="cbSetTab('groups')" style="flex:1;padding:6px;border:none;border-radius:8px;font-family:inherit;font-size:0.8rem;font-weight:600;cursor:pointer;background:none;color:var(--gray);transition:all 0.2s" onmouseover="this.style.background='var(--cb-hover)'" onmouseout="if(cbCurrentTab!='groups')this.style.background='none'">👥 Groups</button>
    </div>
    <div id="cbConvList" style="flex:1;overflow-y:auto;padding:4px 8px"></div>
  </div>

  <!-- MAIN CHAT AREA -->
  <div id="cbMain" style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">
    <div id="cbEmpty" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gray-light);gap:12px">
      <div style="font-size:3rem">🌽</div>
      <p style="font-size:0.95rem;font-weight:500" data-i18n="cb_select_conv">Select a conversation</p>
      <p style="font-size:0.82rem" data-i18n="cb_or_new">or start a new one</p>
      <button onclick="cbShowNewChat()" style="margin-top:8px;padding:10px 24px;background:var(--sage);color:#fff;border:none;border-radius:20px;font-family:inherit;font-size:0.85rem;font-weight:600;cursor:pointer" data-i18n="cb_new_chat">✏️ New message</button>
    </div>
    <div id="cbChatWindow" style="display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden">
      <div id="cbChatHeader" style="padding:12px 20px;border-bottom:1px solid var(--cb-border);display:flex;align-items:center;gap:12px;background:var(--cb-sidebar)">
        <button id="cbBackBtn" onclick="cbGoBack()">←</button>
        <div id="cbHeaderAvatar" style="width:38px;height:38px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1rem;flex-shrink:0"></div>
        <div style="flex:1;min-width:0">
          <div id="cbHeaderName" style="font-weight:700;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
          <div id="cbHeaderStatus" style="font-size:0.75rem;color:var(--gray-light)">offline</div>
        </div>
        <div style="display:flex;gap:4px">
          <button onclick="cbStartCall('voice')" title="Voice call" style="background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;font-size:1.1rem;transition:background 0.2s" onmouseover="this.style.background='var(--cb-hover)'" onmouseout="this.style.background='none'">📞</button>
          <button onclick="cbStartCall('video')" title="Video call" style="background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;font-size:1.1rem;transition:background 0.2s" onmouseover="this.style.background='var(--cb-hover)'" onmouseout="this.style.background='none'">📹</button>
          <button onclick="cbToggleInfo()" title="Info" style="background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;font-size:1.1rem;transition:background 0.2s" onmouseover="this.style.background='var(--cb-hover)'" onmouseout="this.style.background='none'">ℹ️</button>
        </div>
      </div>
      <div id="cbMessages" style="flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px;background:var(--cb-bg)"></div>
      <div id="cbTyping" style="display:none;padding:4px 20px 0;font-size:0.78rem;color:var(--gray-light);font-style:italic"></div>
      <div id="cbReplyPreview" style="display:none;margin:0 16px;padding:8px 12px;background:var(--cb-hover);border-left:3px solid var(--sage);border-radius:0 8px 8px 0;font-size:0.8rem;color:var(--gray);align-items:center;justify-content:space-between">
        <span id="cbReplyText" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1"></span>
        <button onclick="cbCancelReply()" style="background:none;border:none;cursor:pointer;color:var(--gray);font-size:1rem;padding:0 0 0 8px">✕</button>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--cb-border);background:var(--cb-sidebar)">
        <div style="display:flex;align-items:flex-end;gap:8px;background:var(--cb-input);border:1.5px solid var(--cb-border);border-radius:20px;padding:6px 6px 6px 16px;transition:border-color 0.2s" onfocusin="this.style.borderColor='var(--sage)'" onfocusout="this.style.borderColor='var(--cb-border)'">
          <button onclick="cbPickEmoji()" title="Emoji" style="background:none;border:none;cursor:pointer;font-size:1.2rem;padding:4px;flex-shrink:0">😊</button>
          <button onclick="cbAttachFile()" title="Attach file" style="background:none;border:none;cursor:pointer;font-size:1.2rem;padding:4px;flex-shrink:0">📎</button>
          <textarea id="cbInput" placeholder="Message…" data-i18n-placeholder="cb_type_msg" rows="1"
            style="flex:1;border:none;background:none;font-family:inherit;font-size:0.9rem;resize:none;outline:none;max-height:120px;line-height:1.5;color:inherit;padding:4px 0"
            oninput="cbAutoResize(this);cbSendTyping()"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();cbSendMessage()}"></textarea>
          <button onclick="cbSendMessage()" style="background:var(--sage);border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.2s" onmouseover="this.style.background='var(--sage-dark)'" onmouseout="this.style.background='var(--sage)'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <input type="file" id="cbFileInput" style="display:none" onchange="cbHandleFile(this)"/>
      </div>
    </div>
  </div>
</div>

<!-- NEW CHAT MODAL -->
<div id="cbNewChatModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--white);border-radius:16px;padding:28px;width:360px;max-width:90vw">
    <h3 style="margin-bottom:16px;font-size:1rem" data-i18n="cb_new_chat">✏️ New message</h3>
    <input id="cbNewChatEmail" type="email" placeholder="Recipient email…"
      style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;margin-bottom:12px"
      onfocus="this.style.borderColor='var(--sage)'" onblur="this.style.borderColor='var(--border)'"
      onkeydown="if(event.key==='Enter')cbCreateConversation()"/>
    <div id="cbNewChatErr" style="display:none;font-size:0.8rem;color:#e74c3c;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="cbCloseModal('cbNewChatModal')" style="padding:8px 18px;border:1.5px solid var(--border);border-radius:8px;background:none;font-family:inherit;cursor:pointer">Cancel</button>
      <button onclick="cbCreateConversation()" style="padding:8px 18px;background:var(--sage);color:#fff;border:none;border-radius:8px;font-family:inherit;font-weight:600;cursor:pointer">Send</button>
    </div>
  </div>
</div>

<!-- NEW GROUP MODAL -->
<div id="cbNewGroupModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--white);border-radius:16px;padding:28px;width:360px;max-width:90vw">
    <h3 style="margin-bottom:16px;font-size:1rem" data-i18n="cb_new_group">👥 Create group</h3>
    <input id="cbGroupName" type="text" placeholder="Group name…"
      style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;margin-bottom:10px"
      onfocus="this.style.borderColor='var(--sage)'" onblur="this.style.borderColor='var(--border)'"/>
    <input id="cbGroupDesc" type="text" placeholder="Description (optional)…"
      style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.9rem;outline:none;margin-bottom:12px"
      onfocus="this.style.borderColor='var(--sage)'" onblur="this.style.borderColor='var(--border)'"/>
    <div id="cbNewGroupErr" style="display:none;font-size:0.8rem;color:#e74c3c;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="cbCloseModal('cbNewGroupModal')" style="padding:8px 18px;border:1.5px solid var(--border);border-radius:8px;background:none;font-family:inherit;cursor:pointer">Cancel</button>
      <button onclick="cbCreateGroup()" style="padding:8px 18px;background:var(--sage);color:#fff;border:none;border-radius:8px;font-family:inherit;font-weight:600;cursor:pointer" data-i18n="cb_create_group">Create group</button>
    </div>
  </div>
</div>

<!-- PASSCODE MODAL -->
<div id="cbPasscodeModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center">
  <div style="background:var(--white);border-radius:20px;padding:32px 28px;width:320px;max-width:90vw;text-align:center">
    <div style="margin-bottom:16px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="36" height="36" style="display:block;margin:0 auto 12px">
        <circle cx="55" cy="55" r="38" fill="none" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
        <line x1="81" y1="79" x2="98" y2="98" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
        <polyline points="20,55 28,38 35,68 43,32 51,60 58,43 66,70 74,48 90,55" fill="none" stroke="#4a7c59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h3 style="font-size:1rem;font-weight:700;color:var(--black);margin-bottom:6px">Cùi Bắp</h3>
      <p style="font-size:0.85rem;color:var(--gray)" data-i18n="cb_enter_passcode">Enter passcode</p>
    </div>
    <!-- 6 digit dots display -->
    <div style="display:flex;justify-content:center;gap:12px;margin-bottom:24px" id="cbDots">
      <div class="cb-dot"></div><div class="cb-dot"></div><div class="cb-dot"></div>
      <div class="cb-dot"></div><div class="cb-dot"></div><div class="cb-dot"></div>
    </div>
    <!-- Number pad -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:220px;margin:0 auto">
      <button class="cb-pad-btn" onclick="cbPadPress('1')">1</button>
      <button class="cb-pad-btn" onclick="cbPadPress('2')">2</button>
      <button class="cb-pad-btn" onclick="cbPadPress('3')">3</button>
      <button class="cb-pad-btn" onclick="cbPadPress('4')">4</button>
      <button class="cb-pad-btn" onclick="cbPadPress('5')">5</button>
      <button class="cb-pad-btn" onclick="cbPadPress('6')">6</button>
      <button class="cb-pad-btn" onclick="cbPadPress('7')">7</button>
      <button class="cb-pad-btn" onclick="cbPadPress('8')">8</button>
      <button class="cb-pad-btn" onclick="cbPadPress('9')">9</button>
      <button class="cb-pad-btn" onclick="cbPadClear()" style="font-size:0.8rem;color:var(--gray)">⌫</button>
      <button class="cb-pad-btn" onclick="cbPadPress('0')">0</button>
      <button class="cb-pad-btn" onclick="cbPasscodeClose()" style="font-size:0.75rem;color:var(--gray)" data-i18n="cancel">Cancel</button>
    </div>
    <p id="cbPasscodeErr" style="display:none;font-size:0.78rem;color:#e74c3c;margin-top:12px">Incorrect passcode</p>
  </div>
</div>

<style>
.cb-dot{width:14px;height:14px;border-radius:50%;border:2px solid #ccc;background:transparent;transition:background 0.15s}
.cb-dot.filled{background:#4a7c59;border-color:#4a7c59}
.cb-pad-btn{padding:14px;border:1.5px solid var(--border);border-radius:12px;background:none;font-family:inherit;font-size:1.1rem;font-weight:600;color:var(--black);cursor:pointer;transition:background 0.15s}
.cb-pad-btn:hover{background:var(--sage-light,#e8f0eb)}
.cb-pad-btn:active{background:#d0e5d8}
</style>

<script>
let cbPasscode = '';
const CB_DEFAULT_PASSCODE = '000000';

function cbShowPasscode() {
  cbPasscode = '';
  cbUpdateDots();
  document.getElementById('cbPasscodeModal').style.display = 'flex';
  document.getElementById('cbPasscodeErr').style.display = 'none';
}

function cbPasscodeClose() {
  document.getElementById('cbPasscodeModal').style.display = 'none';
  cbPasscode = '';
  cbUpdateDots();
}

function cbPadPress(digit) {
  if (cbPasscode.length >= 6) return;
  cbPasscode += digit;
  cbUpdateDots();
  if (cbPasscode.length === 6) {
    setTimeout(cbCheckPasscode, 200);
  }
}

function cbPadClear() {
  cbPasscode = cbPasscode.slice(0, -1);
  cbUpdateDots();
}

function cbUpdateDots() {
  document.querySelectorAll('.cb-dot').forEach((d, i) => {
    d.classList.toggle('filled', i < cbPasscode.length);
  });
}

function cbCheckPasscode() {
  const saved = localStorage.getItem('cbPasscode') || CB_DEFAULT_PASSCODE;
  if (cbPasscode === saved) {
    cbPasscodeClose();
    document.getElementById('cbLanding').style.display = 'none';
    document.getElementById('cbApp').style.display = 'flex';
    cbInit();
  } else {
    document.getElementById('cbPasscodeErr').style.display = 'block';
    cbPasscode = '';
    cbUpdateDots();
  }
}
</script>

</section>
