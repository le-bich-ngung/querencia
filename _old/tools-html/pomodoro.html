<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pomodoro - Querencia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f5f0e8;
  --bg2:      #ede6d6;
  --cream:    #faf7f0;
  --brown:    #3d2b1f;
  --brown2:   #6b4c3b;
  --tan:      #c4a882;
  --tan-pale: #e8dcc8;
  --sage:     #4a7c59;
  --sage-pale:#ddeee3;
  --red:      #c0392b;
  --red-pale: #fdecea;
  --font-display: 'Playfair Display', serif;
  --font: 'Plus Jakarta Sans', sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--brown);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

/* ── BACKGROUND TEXTURE ─────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(196,168,130,0.18) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(74,124,89,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 10%, rgba(192,57,43,0.06) 0%, transparent 40%);
  pointer-events: none;
}

/* ── GRAIN OVERLAY ──────────────────────────────── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  opacity: 0.6;
}

/* ── WRAPPER ────────────────────────────────────── */
.wrapper {
  width: 100%;
  max-width: 480px;
  position: relative;
  z-index: 1;
}

/* ── HEADER ─────────────────────────────────────── */
.header {
  text-align: center;
  margin-bottom: 36px;
}
.header h1 {
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 400;
  color: var(--brown);
  letter-spacing: -0.3px;
}
.header h1 em { font-style: italic; color: var(--brown2); }
.header p {
  font-size: 0.78rem;
  color: var(--tan);
  font-weight: 500;
  margin-top: 4px;
  letter-spacing: 0.06em;
}

/* ── MODE TABS ──────────────────────────────────── */
.mode-tabs {
  display: flex;
  background: var(--tan-pale);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 32px;
  gap: 4px;
}
.mode-tab {
  flex: 1;
  padding: 9px 8px;
  border: none;
  border-radius: 10px;
  background: none;
  font-family: var(--font);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--tan);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.03em;
}
.mode-tab.active {
  background: var(--cream);
  color: var(--brown);
  box-shadow: 0 2px 8px rgba(61,43,31,0.10);
}
.mode-tab:hover:not(.active) { color: var(--brown2); }

/* ── TIMER CARD ─────────────────────────────────── */
.timer-card {
  background: var(--cream);
  border-radius: 28px;
  padding: 48px 40px 40px;
  box-shadow:
    0 2px 0 rgba(255,255,255,0.8) inset,
    0 16px 64px rgba(61,43,31,0.12),
    0 2px 8px rgba(61,43,31,0.06);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.timer-card::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(196,168,130,0.12), transparent 70%);
  pointer-events: none;
}

/* Ring */
.ring-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 32px;
  position: relative;
}

.ring-svg {
  transform: rotate(-90deg);
  filter: drop-shadow(0 4px 16px rgba(74,124,89,0.2));
}

.ring-bg {
  fill: none;
  stroke: var(--tan-pale);
  stroke-width: 6;
}

.ring-progress {
  fill: none;
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
}

.ring-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.time-display {
  font-family: var(--font-display);
  font-size: 4rem;
  font-weight: 400;
  color: var(--brown);
  line-height: 1;
  letter-spacing: -2px;
}

.session-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--tan);
  margin-top: 6px;
}

/* ── CONTROLS ───────────────────────────────────── */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.ctrl-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--tan-pale);
  background: var(--bg);
  color: var(--brown2);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s;
}
.ctrl-btn:hover { border-color: var(--tan); background: var(--tan-pale); }

.play-btn {
  width: 68px; height: 68px;
  border-radius: 50%;
  border: none;
  background: var(--brown);
  color: var(--cream);
  font-size: 1.4rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s;
  box-shadow: 0 4px 20px rgba(61,43,31,0.25);
}
.play-btn:hover { background: var(--brown2); transform: scale(1.04); }
.play-btn:active { transform: scale(0.97); }

/* mode-specific ring colors */
body.mode-focus   .ring-progress { stroke: var(--brown); }
body.mode-short   .ring-progress { stroke: var(--sage); }
body.mode-long    .ring-progress { stroke: var(--sage); }

body.mode-focus .play-btn  { background: var(--brown); }
body.mode-short .play-btn  { background: var(--sage); }
body.mode-long  .play-btn  { background: var(--sage); }

/* ── SESSION DOTS ───────────────────────────────── */
.sessions-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
}
.session-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--tan-pale);
  transition: all 0.3s;
}
.session-dot.done { background: var(--brown2); }
.session-dot.current { background: var(--brown); transform: scale(1.3); }

/* ── SETTINGS CARD ──────────────────────────────── */
.settings-card {
  background: var(--cream);
  border-radius: 20px;
  padding: 20px 24px;
  box-shadow: 0 4px 24px rgba(61,43,31,0.07);
  margin-bottom: 20px;
}

.settings-title {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--tan);
  margin-bottom: 14px;
}

.settings-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.setting-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.setting-label {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--tan);
  text-align: center;
  letter-spacing: 0.04em;
}
.setting-control {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg);
  border-radius: 10px;
  padding: 4px 8px;
  border: 1.5px solid var(--tan-pale);
}
.setting-control button {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--tan);
  font-size: 0.9rem;
  line-height: 1;
  padding: 0 2px;
  transition: color 0.15s;
}
.setting-control button:hover { color: var(--brown); }
.setting-val {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 400;
  color: var(--brown);
  min-width: 22px;
  text-align: center;
}

/* ── STATS ROW ──────────────────────────────────── */
.stats-row {
  display: flex;
  gap: 10px;
}
.stat-card {
  flex: 1;
  background: var(--cream);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 2px 12px rgba(61,43,31,0.06);
  text-align: center;
}
.stat-val {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 400;
  color: var(--brown);
  line-height: 1;
}
.stat-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--tan);
  margin-top: 4px;
}

/* ── PULSE ANIMATION ────────────────────────────── */
@keyframes pulse-ring {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.03); opacity: 0.85; }
  100% { transform: scale(1); opacity: 1; }
}
.timer-card.running .ring-svg {
  animation: pulse-ring 2s ease-in-out infinite;
}

/* ── FINISHED FLASH ─────────────────────────────── */
@keyframes flash-bg {
  0%, 100% { background: var(--cream); }
  50% { background: var(--sage-pale); }
}
.timer-card.finished {
  animation: flash-bg 0.6s ease 3;
}
</style>
</head>
<body class="mode-focus">

<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <h1>Focus <em>Timer</em></h1>
    <p>Stay present. One session at a time.</p>
  </div>

  <!-- Mode tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-focus" onclick="setMode('focus')">Focus</button>
    <button class="mode-tab" id="tab-short" onclick="setMode('short')">Short Break</button>
    <button class="mode-tab" id="tab-long" onclick="setMode('long')">Long Break</button>
  </div>

  <!-- Timer card -->
  <div class="timer-card" id="timerCard">
    <div class="ring-wrap">
      <svg class="ring-svg" id="ringSvg" width="220" height="220" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="95"/>
        <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="95"
          stroke-dasharray="596.9" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="session-label" id="sessionLabel">Focus Session</div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" onclick="skipBack()" title="Restart">↺</button>
      <button class="play-btn" id="playBtn" onclick="toggleTimer()">▶</button>
      <button class="ctrl-btn" onclick="skipNext()" title="Skip">⏭</button>
    </div>

    <div class="sessions-row" id="sessionsRow"></div>
  </div>

  <!-- Settings -->
  <div class="settings-card">
    <div class="settings-title">Duration (minutes)</div>
    <div class="settings-grid">
      <div class="setting-item">
        <div class="setting-label">Focus</div>
        <div class="setting-control">
          <button onclick="adjustSetting('focus',-1)">−</button>
          <span class="setting-val" id="set-focus">25</span>
          <button onclick="adjustSetting('focus',1)">+</button>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">Short Break</div>
        <div class="setting-control">
          <button onclick="adjustSetting('short',-1)">−</button>
          <span class="setting-val" id="set-short">5</span>
          <button onclick="adjustSetting('short',1)">+</button>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">Long Break</div>
        <div class="setting-control">
          <button onclick="adjustSetting('long',-1)">−</button>
          <span class="setting-val" id="set-long">15</span>
          <button onclick="adjustSetting('long',1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="stat-sessions">0</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-minutes">0</div>
      <div class="stat-label">Min Focused</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-streak">0</div>
      <div class="stat-label">Streak</div>
    </div>
  </div>

</div>

<script>
// ============================================================
// STATE
// ============================================================
const CIRCUMFERENCE = 2 * Math.PI * 95; // 596.9

let settings = { focus: 25, short: 5, long: 15 };
let currentMode = 'focus';
let totalSeconds = 25 * 60;
let remaining = totalSeconds;
let running = false;
let interval = null;
let completedSessions = 0;
let totalMinutes = 0;
let streak = 0;
let lastSessionDate = null;

const MODES = {
  focus: { label: 'Focus Session',    sessions: 4 },
  short: { label: 'Short Break',      sessions: null },
  long:  { label: 'Long Break',       sessions: null },
};

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  loadStats();
  renderSessions();
  updateDisplay();
  updateRing();
});

// ============================================================
// MODE
// ============================================================
function setMode(mode) {
  if (running) return;
  currentMode = mode;
  document.body.className = 'mode-' + mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + mode).classList.add('active');
  totalSeconds = settings[mode] * 60;
  remaining = totalSeconds;
  updateDisplay();
  updateRing();
  renderSessions();
}

// ============================================================
// TIMER
// ============================================================
function toggleTimer() {
  if (running) {
    pause();
  } else {
    start();
  }
}

function start() {
  running = true;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('timerCard').classList.add('running');
  interval = setInterval(tick, 1000);
}

function pause() {
  running = false;
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('timerCard').classList.remove('running');
  clearInterval(interval);
}

function tick() {
  remaining--;
  if (remaining <= 0) {
    remaining = 0;
    finish();
    return;
  }
  updateDisplay();
  updateRing();
}

function finish() {
  pause();
  document.getElementById('timerCard').classList.add('finished');
  setTimeout(() => document.getElementById('timerCard').classList.remove('finished'), 2000);

  if (currentMode === 'focus') {
    completedSessions++;
    totalMinutes += settings.focus;
    updateStreak();
    saveStats();
    renderStats();
    renderSessions();

    // Auto suggest break
    if (completedSessions % 4 === 0) {
      setTimeout(() => setMode('long'), 1200);
    } else {
      setTimeout(() => setMode('short'), 1200);
    }
  } else {
    setTimeout(() => setMode('focus'), 1200);
  }

  playSound();
  updateDisplay();
}

function skipBack() {
  pause();
  remaining = totalSeconds;
  updateDisplay();
  updateRing();
}

function skipNext() {
  pause();
  remaining = 0;
  finish();
}

// ============================================================
// DISPLAY
// ============================================================
function updateDisplay() {
  const m = Math.floor(remaining / 60).toString().padStart(2, '0');
  const s = (remaining % 60).toString().padStart(2, '0');
  document.getElementById('timeDisplay').textContent = m + ':' + s;
  document.getElementById('sessionLabel').textContent = MODES[currentMode].label;
  document.title = m + ':' + s + ' - Pomodoro';
}

function updateRing() {
  const pct = remaining / totalSeconds;
  const offset = CIRCUMFERENCE * (1 - pct);
  document.getElementById('ringProgress').style.strokeDashoffset = offset;
}

// ============================================================
// SESSION DOTS
// ============================================================
function renderSessions() {
  const row = document.getElementById('sessionsRow');
  const total = 4;
  const done = completedSessions % 4;
  row.innerHTML = Array.from({length: total}, (_, i) => {
    let cls = 'session-dot';
    if (i < done) cls += ' done';
    else if (i === done && currentMode === 'focus') cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
}

// ============================================================
// SETTINGS
// ============================================================
function adjustSetting(key, delta) {
  if (running) return;
  settings[key] = Math.max(1, Math.min(90, settings[key] + delta));
  document.getElementById('set-' + key).textContent = settings[key];
  if (key === currentMode) {
    totalSeconds = settings[key] * 60;
    remaining = totalSeconds;
    updateDisplay();
    updateRing();
  }
}

// ============================================================
// STATS
// ============================================================
function updateStreak() {
  const today = new Date().toDateString();
  if (lastSessionDate === today) {
    // same day, streak already counted
  } else if (lastSessionDate === new Date(Date.now() - 86400000).toDateString()) {
    streak++;
  } else if (lastSessionDate !== today) {
    streak = 1;
  }
  lastSessionDate = today;
}

function renderStats() {
  document.getElementById('stat-sessions').textContent = completedSessions;
  document.getElementById('stat-minutes').textContent = totalMinutes;
  document.getElementById('stat-streak').textContent = streak;
}

function saveStats() {
  try {
    localStorage.setItem('pomo_stats', JSON.stringify({
      completedSessions, totalMinutes, streak, lastSessionDate
    }));
  } catch(e) {}
}

function loadStats() {
  try {
    const d = JSON.parse(localStorage.getItem('pomo_stats') || '{}');
    completedSessions = d.completedSessions || 0;
    totalMinutes      = d.totalMinutes || 0;
    streak            = d.streak || 0;
    lastSessionDate   = d.lastSessionDate || null;
    renderStats();
  } catch(e) {}
}

// ============================================================
// SOUND (gentle bell via Web Audio API)
// ============================================================
function playSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const freqs = [523.25, 659.25, 783.99]; // C-E-G
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      osc.start(t); osc.stop(t + 1.2);
    });
  } catch(e) {}
}
</script>
</body>
</html>
