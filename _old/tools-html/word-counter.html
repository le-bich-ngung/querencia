<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Word Counter — Querencia</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f9f7f4;
  --white: #ffffff;
  --panel: #f2eeea;
  --border: #e4dfd8;
  --black: #1e1a16;
  --brown: #5c4a38;
  --gray: #8a7d70;
  --gray-light: #c4b8ac;
  --accent: #4a7c59;
  --accent-pale: #e8f2ec;
  --amber: #b87820;
  --amber-pale: #fdf4e3;
  --red: #c0392b;
  --font: 'Plus Jakarta Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--black);
  min-height: 100vh;
  display: grid;
  grid-template-rows: 52px 1fr;
}

/* ── TOPBAR ─────────────────────────────────────── */
.topbar {
  background: var(--white);
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 10px;
}
.logo { font-size: 0.88rem; font-weight: 700; }
.logo span { color: var(--accent); }
.sep { width: 1px; height: 22px; background: var(--border); }
.tbtn {
  padding: 6px 14px;
  border-radius: 7px;
  border: 1.5px solid var(--border);
  background: none;
  color: var(--gray);
  font-family: var(--font);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.14s;
}
.tbtn:hover { border-color: var(--accent); color: var(--accent); }
.topbar-right { margin-left: auto; display: flex; gap: 8px; }

/* ── MAIN ───────────────────────────────────────── */
.main {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 0;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── EDITOR ─────────────────────────────────────── */
.editor-wrap {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1.5px solid var(--border);
}

/* Goal bar */
.goal-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.goal-label { font-size: 0.72rem; font-weight: 600; color: var(--gray); }
.goal-input {
  width: 80px;
  padding: 4px 8px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 0.82rem;
  color: var(--black);
  background: var(--bg);
  outline: none;
}
.goal-input:focus { border-color: var(--accent); }
.goal-progress-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.goal-progress { height: 100%; border-radius: 3px; transition: width 0.3s, background 0.3s; background: var(--accent); }
.goal-pct { font-size: 0.72rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 36px; }

#editor {
  flex: 1;
  padding: 28px 32px;
  border: none;
  outline: none;
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.85;
  color: var(--black);
  background: var(--bg);
  resize: none;
  overflow-y: auto;
}
#editor::-webkit-scrollbar { width: 4px; }
#editor::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
#editor::placeholder { color: var(--gray-light); }

/* ── RIGHT PANEL ────────────────────────────────── */
.right-panel {
  background: var(--white);
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.right-panel::-webkit-scrollbar { width: 3px; }
.right-panel::-webkit-scrollbar-thumb { background: var(--border); }

.stat-section-title {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gray-light);
  margin-bottom: 10px;
}

/* Big stat */
.big-stat {
  background: var(--panel);
  border-radius: 14px;
  padding: 16px 18px;
  text-align: center;
}
.big-stat-val {
  font-family: var(--mono);
  font-size: 2.8rem;
  font-weight: 500;
  color: var(--black);
  line-height: 1;
  letter-spacing: -1px;
}
.big-stat-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gray);
  margin-top: 6px;
}

/* Stats grid */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.stat-box {
  background: var(--panel);
  border-radius: 10px;
  padding: 12px 14px;
}
.stat-box-val {
  font-family: var(--mono);
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--brown);
  line-height: 1;
}
.stat-box-label {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--gray);
  margin-top: 4px;
  letter-spacing: 0.04em;
}

/* Reading time */
.reading-box {
  background: var(--accent-pale);
  border: 1.5px solid #b8d9c4;
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.reading-icon { font-size: 1.4rem; }
.reading-info {}
.reading-val {
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
}
.reading-label { font-size: 0.68rem; color: var(--gray); margin-top: 2px; }

/* Top words */
.word-list { display: flex; flex-direction: column; gap: 6px; }
.word-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.word-rank { font-size: 0.65rem; color: var(--gray-light); width: 16px; font-variant-numeric: tabular-nums; }
.word-bar-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.word-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }
.word-text { font-family: var(--mono); font-size: 0.72rem; color: var(--brown); min-width: 60px; }
.word-count-val { font-family: var(--mono); font-size: 0.68rem; color: var(--gray-light); min-width: 20px; text-align: right; }

/* Density */
.density-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.density-label { font-size: 0.72rem; color: var(--gray); flex: 1; }
.density-val { font-family: var(--mono); font-size: 0.75rem; font-weight: 600; color: var(--brown); }
.density-bar-w { flex: 2; height: 5px; background: var(--border); border-radius: 2px; overflow: hidden; }
.density-bar { height: 100%; border-radius: 2px; background: var(--amber); transition: width 0.3s; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Word <span>Counter</span></div>
  <div class="sep"></div>
  <button class="tbtn" onclick="clearAll()">Clear</button>
  <button class="tbtn" onclick="pasteClipboard()">Paste</button>
  <div class="topbar-right">
    <button class="tbtn" onclick="copyStats()">⎘ Copy Stats</button>
  </div>
</div>

<div class="main">

  <!-- Editor -->
  <div class="editor-wrap">
    <div class="goal-bar">
      <span class="goal-label">Word Goal</span>
      <input type="number" class="goal-input" id="goalInput" value="500" min="0" oninput="updateGoal()"/>
      <div class="goal-progress-wrap">
        <div class="goal-progress" id="goalProgress" style="width:0%"></div>
      </div>
      <span class="goal-pct" id="goalPct">0%</span>
    </div>
    <textarea id="editor" placeholder="Paste or type your text here…" oninput="analyze()"></textarea>
  </div>

  <!-- Right panel -->
  <div class="right-panel">

    <!-- Words (big) -->
    <div>
      <div class="stat-section-title">Primary</div>
      <div class="big-stat">
        <div class="big-stat-val" id="statWords">0</div>
        <div class="big-stat-label">Words</div>
      </div>
    </div>

    <!-- Stats grid -->
    <div>
      <div class="stat-section-title">Counts</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-box-val" id="statChars">0</div>
          <div class="stat-box-label">Characters</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="statCharsNoSpace">0</div>
          <div class="stat-box-label">No Spaces</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="statSentences">0</div>
          <div class="stat-box-label">Sentences</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="statParagraphs">0</div>
          <div class="stat-box-label">Paragraphs</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="statUnique">0</div>
          <div class="stat-box-label">Unique Words</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="statAvgWord">0</div>
          <div class="stat-box-label">Avg Word Len</div>
        </div>
      </div>
    </div>

    <!-- Reading time -->
    <div>
      <div class="stat-section-title">Reading Time</div>
      <div class="reading-box">
        <div class="reading-icon">📖</div>
        <div class="reading-info">
          <div class="reading-val" id="readTime">0 sec</div>
          <div class="reading-label">at 200 words/min</div>
        </div>
      </div>
    </div>

    <!-- Top words -->
    <div>
      <div class="stat-section-title">Top Words</div>
      <div class="word-list" id="wordList">
        <div style="font-size:0.72rem;color:var(--gray-light);text-align:center;padding:8px 0">No text yet</div>
      </div>
    </div>

    <!-- Density -->
    <div>
      <div class="stat-section-title">Text Density</div>
      <div id="densitySection">
        <div class="density-row">
          <span class="density-label">Avg sentence length</span>
          <div class="density-bar-w"><div class="density-bar" id="db-sent" style="width:0%"></div></div>
          <span class="density-val" id="dv-sent">0</span>
        </div>
        <div class="density-row">
          <span class="density-label">Lexical diversity</span>
          <div class="density-bar-w"><div class="density-bar" id="db-lex" style="width:0%"></div></div>
          <span class="density-val" id="dv-lex">0%</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// STOPWORDS
const STOP = new Set(['the','a','an','and','or','but','in','on','at','to','for',
  'of','with','by','from','is','are','was','were','be','been','being',
  'have','has','had','do','does','did','will','would','could','should',
  'may','might','shall','can','it','its','this','that','these','those',
  'i','you','he','she','we','they','me','him','her','us','them',
  'my','your','his','our','their','what','which','who','not','as','so']);

function analyze() {
  const text = document.getElementById('editor').value;

  const words = text.trim() ? text.trim().split(/\s+/).filter(Boolean) : [];
  const wordCount = words.length;
  const chars = text.length;
  const charsNoSpace = text.replace(/\s/g,'').length;
  const sentences = text.trim() ? (text.match(/[^.!?]*[.!?]+/g) || [text]).length : 0;
  const paragraphs = text.trim() ? text.split(/\n\s*\n/).filter(p => p.trim()).length : 0;

  const cleanWords = words.map(w => w.toLowerCase().replace(/[^a-z']/g,''));
  const uniqueWords = new Set(cleanWords.filter(Boolean));
  const avgWordLen = cleanWords.length
    ? (cleanWords.reduce((s, w) => s + w.length, 0) / cleanWords.length).toFixed(1)
    : 0;

  // Set stats
  document.getElementById('statWords').textContent = fmt(wordCount);
  document.getElementById('statChars').textContent = fmt(chars);
  document.getElementById('statCharsNoSpace').textContent = fmt(charsNoSpace);
  document.getElementById('statSentences').textContent = fmt(sentences);
  document.getElementById('statParagraphs').textContent = fmt(paragraphs);
  document.getElementById('statUnique').textContent = fmt(uniqueWords.size);
  document.getElementById('statAvgWord').textContent = avgWordLen;

  // Reading time
  const mins = wordCount / 200;
  let timeStr;
  if (mins < 1) timeStr = Math.max(1, Math.round(mins * 60)) + ' sec';
  else if (mins < 60) timeStr = mins.toFixed(1).replace('.0','') + ' min';
  else timeStr = (mins/60).toFixed(1) + ' hr';
  document.getElementById('readTime').textContent = timeStr;

  // Top words (exclude stopwords)
  const freq = {};
  cleanWords.filter(w => w.length > 2 && !STOP.has(w)).forEach(w => freq[w] = (freq[w]||0)+1);
  const top = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxFreq = top[0]?.[1] || 1;

  const wl = document.getElementById('wordList');
  if (!top.length) {
    wl.innerHTML = '<div style="font-size:0.72rem;color:var(--gray-light);text-align:center;padding:8px 0">No significant words yet</div>';
  } else {
    wl.innerHTML = top.map(([w, c], i) => `
      <div class="word-row">
        <span class="word-rank">${i+1}</span>
        <span class="word-text">${w}</span>
        <div class="word-bar-wrap"><div class="word-bar" style="width:${(c/maxFreq*100)}%"></div></div>
        <span class="word-count-val">${c}</span>
      </div>
    `).join('');
  }

  // Density
  const avgSent = sentences ? (wordCount / sentences).toFixed(1) : 0;
  const lexDiv  = wordCount ? Math.round((uniqueWords.size / wordCount) * 100) : 0;
  document.getElementById('db-sent').style.width = Math.min(100, avgSent / 30 * 100) + '%';
  document.getElementById('dv-sent').textContent = avgSent;
  document.getElementById('db-lex').style.width = lexDiv + '%';
  document.getElementById('dv-lex').textContent = lexDiv + '%';

  updateGoal(wordCount);
}

function fmt(n) {
  return n >= 1000 ? (n/1000).toFixed(1)+'k' : n.toString();
}

function updateGoal(wordCount) {
  const goal = parseInt(document.getElementById('goalInput').value) || 0;
  if (!wordCount) wordCount = parseInt(document.getElementById('statWords').textContent) || 0;
  const pct = goal ? Math.min(100, Math.round(wordCount / goal * 100)) : 0;
  document.getElementById('goalProgress').style.width = pct + '%';
  document.getElementById('goalProgress').style.background = pct >= 100 ? '#52b87a' : 'var(--accent)';
  document.getElementById('goalPct').textContent = pct + '%';
  document.getElementById('goalPct').style.color = pct >= 100 ? '#52b87a' : 'var(--accent)';
}

function clearAll() {
  document.getElementById('editor').value = '';
  analyze();
}

async function pasteClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('editor').value = text;
    analyze();
  } catch(e) { alert('Allow clipboard access to paste.'); }
}

function copyStats() {
  const stats = `Words: ${document.getElementById('statWords').textContent}
Characters: ${document.getElementById('statChars').textContent}
Sentences: ${document.getElementById('statSentences').textContent}
Paragraphs: ${document.getElementById('statParagraphs').textContent}
Unique Words: ${document.getElementById('statUnique').textContent}
Reading Time: ${document.getElementById('readTime').textContent}`;
  navigator.clipboard.writeText(stats).then(() => {
    const btn = event.target;
    btn.textContent = '✓ Copied';
    setTimeout(() => btn.textContent = '⎘ Copy Stats', 2000);
  });
}
</script>
</body>
</html>
