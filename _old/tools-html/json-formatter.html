<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JSON Formatter - Querencia</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #111; --panel: #171717; --panel2: #1e1e1e; --border: #2a2a2a;
  --white: #f0eeec; --gray: #777; --gray-light: #444;
  --accent: #4a7c59; --accent-light: #6fa882;
  --red: #e05252; --yellow: #d4a843; --green: #52b87a;
  --k: #c792ea; --s: #89ddff; --n: #f78c6c; --b: #82aaff;
  --font: 'Plus Jakarta Sans', sans-serif; --mono: 'DM Mono', monospace;
}
body { font-family: var(--font); background: var(--bg); color: var(--white);
  height: 100vh; display: grid; grid-template-rows: 48px 1fr; overflow: hidden; }

/* TOPBAR */
.topbar { background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 8px; }
.logo { font-size: 0.88rem; font-weight: 700; margin-right: 4px; }
.logo span { color: var(--accent-light); }
.sep { width: 1px; height: 20px; background: var(--border); }
.tbtn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: none; color: var(--gray); font-family: var(--font); font-size: 0.73rem;
  font-weight: 600; cursor: pointer; transition: all 0.14s; }
.tbtn:hover { border-color: var(--accent); color: var(--accent-light); }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbtn.primary:hover { background: #3d6b4a; }
.topbar-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }

/* STATUS */
.status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700;
  display: flex; align-items: center; gap: 5px; }
.status-badge.valid { background: rgba(82,184,122,0.12); color: var(--green); border: 1px solid rgba(82,184,122,0.3); }
.status-badge.invalid { background: rgba(224,82,82,0.12); color: var(--red); border: 1px solid rgba(224,82,82,0.3); }
.status-badge.idle { background: var(--panel2); color: var(--gray); border: 1px solid var(--border); }

/* MAIN */
.main { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
.pane { display: flex; flex-direction: column; overflow: hidden; }
.pane:first-child { border-right: 1px solid var(--border); }
.pane-header { padding: 8px 14px; background: var(--panel2); border-bottom: 1px solid var(--border);
  font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gray); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.pane-actions { display: flex; gap: 4px; }
.pane-btn { padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border);
  background: none; color: var(--gray); font-family: var(--font); font-size: 0.62rem;
  font-weight: 600; cursor: pointer; transition: all 0.12s; }
.pane-btn:hover { border-color: var(--accent); color: var(--accent-light); }

#inputEditor {
  flex: 1; padding: 16px 20px; background: var(--bg); border: none; outline: none;
  font-family: var(--mono); font-size: 0.84rem; line-height: 1.75; color: var(--white);
  resize: none; overflow-y: auto; tab-size: 2;
}
#inputEditor::-webkit-scrollbar { width: 4px; }
#inputEditor::-webkit-scrollbar-thumb { background: var(--border); }
#inputEditor::placeholder { color: var(--gray-light); }

.output-wrap { flex: 1; overflow-y: auto; position: relative; }
.output-wrap::-webkit-scrollbar { width: 4px; }
.output-wrap::-webkit-scrollbar-thumb { background: var(--border); }

#jsonOutput { padding: 16px 20px; font-family: var(--mono); font-size: 0.84rem;
  line-height: 1.75; white-space: pre; overflow-x: auto; min-height: 100%; }

/* JSON syntax colors */
.jk { color: var(--s); }   /* key */
.js { color: var(--n); }   /* string value */
.jn { color: #f78c6c; }    /* number */
.jb { color: var(--b); }   /* boolean */
.jnull { color: var(--gray); } /* null */
.jp { color: var(--gray); }   /* punctuation */

/* Error box */
.error-box { margin: 16px 20px; padding: 12px 14px; background: rgba(224,82,82,0.08);
  border: 1px solid rgba(224,82,82,0.25); border-radius: 8px; font-family: var(--mono);
  font-size: 0.78rem; color: var(--red); line-height: 1.6; display: none; }

/* Stats bar */
.stats-bar { padding: 8px 14px; background: var(--panel2); border-top: 1px solid var(--border);
  display: flex; gap: 16px; flex-shrink: 0; }
.stat { font-size: 0.68rem; color: var(--gray); }
.stat span { color: var(--white); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Tree view panel */
.tree-wrap { flex: 1; overflow-y: auto; padding: 12px; display: none; }
.tree-wrap::-webkit-scrollbar { width: 4px; }
.tree-wrap::-webkit-scrollbar-thumb { background: var(--border); }
.tree-node { margin-left: 16px; }
.tree-key { color: var(--s); font-family: var(--mono); font-size: 0.8rem; cursor: pointer; }
.tree-key:hover { text-decoration: underline; }
.tree-toggle { display: inline-block; width: 14px; color: var(--gray); cursor: pointer; user-select: none; }
.tree-val-str  { color: var(--n);   font-family: var(--mono); font-size: 0.8rem; }
.tree-val-num  { color: #f78c6c;    font-family: var(--mono); font-size: 0.8rem; }
.tree-val-bool { color: var(--b);   font-family: var(--mono); font-size: 0.8rem; }
.tree-val-null { color: var(--gray);font-family: var(--mono); font-size: 0.8rem; }
.tree-line     { display: flex; align-items: flex-start; gap: 4px; padding: 1px 0; font-size: 0.8rem; }
.tree-type-badge { font-size: 0.6rem; font-weight: 700; padding: 1px 5px; border-radius: 3px;
  background: var(--panel2); color: var(--gray-light); margin-left: 4px; }

/* Indent control */
.indent-row { display: flex; align-items: center; gap: 6px; }
.indent-label { font-size: 0.68rem; color: var(--gray); }
.indent-btn { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border);
  background: none; color: var(--gray); cursor: pointer; font-size: 0.8rem; transition: all 0.12s;
  display: flex; align-items: center; justify-content: center; }
.indent-btn:hover { border-color: var(--accent); color: var(--accent-light); }
.indent-val { font-family: var(--mono); font-size: 0.75rem; color: var(--white); min-width: 16px; text-align: center; }

/* View toggle */
.view-toggle { display: flex; background: var(--panel); border-radius: 6px; padding: 2px; gap: 2px; }
.vbtn { padding: 3px 9px; border: none; border-radius: 4px; background: none;
  font-family: var(--font); font-size: 0.68rem; font-weight: 600; color: var(--gray);
  cursor: pointer; transition: all 0.12s; }
.vbtn.active { background: var(--panel2); color: var(--white); }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">JSON <span>Formatter</span></div>
  <div class="sep"></div>
  <button class="tbtn primary" onclick="format()">Format</button>
  <button class="tbtn" onclick="minify()">Minify</button>
  <button class="tbtn" onclick="sortKeys()">Sort Keys</button>
  <button class="tbtn" onclick="clearAll()">Clear</button>
  <div class="topbar-right">
    <div class="status-badge idle" id="statusBadge">● Waiting</div>
    <div class="sep"></div>
    <div class="indent-row">
      <span class="indent-label">Indent</span>
      <button class="indent-btn" onclick="changeIndent(-1)">−</button>
      <span class="indent-val" id="indentVal">2</span>
      <button class="indent-btn" onclick="changeIndent(1)">+</button>
    </div>
    <div class="sep"></div>
    <div class="view-toggle">
      <button class="vbtn active" id="vbtn-code" onclick="setView('code')">Code</button>
      <button class="vbtn" id="vbtn-tree" onclick="setView('tree')">Tree</button>
    </div>
  </div>
</div>

<div class="main">
  <!-- Input -->
  <div class="pane">
    <div class="pane-header">
      Input JSON
      <div class="pane-actions">
        <button class="pane-btn" onclick="loadSample()">Sample</button>
        <button class="pane-btn" onclick="pasteInput()">Paste</button>
      </div>
    </div>
    <textarea id="inputEditor" placeholder='Paste JSON here…&#10;&#10;{"name": "Querencia", "version": 1}' oninput="onInput()" spellcheck="false"></textarea>
    <div class="stats-bar" id="inputStats">
      <div class="stat">Size: <span id="statSize">-</span></div>
      <div class="stat">Lines: <span id="statLines">-</span></div>
    </div>
  </div>

  <!-- Output -->
  <div class="pane">
    <div class="pane-header">
      Formatted Output
      <div class="pane-actions">
        <button class="pane-btn" onclick="copyOutput()">⎘ Copy</button>
        <button class="pane-btn" onclick="downloadOutput()">↓ Save</button>
      </div>
    </div>
    <div class="output-wrap" id="outputWrap">
      <div id="jsonOutput"></div>
      <div id="treeOutput" class="tree-wrap"></div>
      <div class="error-box" id="errorBox"></div>
    </div>
    <div class="stats-bar" id="outputStats">
      <div class="stat">Keys: <span id="statKeys">-</span></div>
      <div class="stat">Depth: <span id="statDepth">-</span></div>
      <div class="stat">Items: <span id="statItems">-</span></div>
    </div>
  </div>
</div>

<script>
let indent = 2;
let currentView = 'code';
let parsedJson = null;
let formattedOutput = '';

function onInput() {
  const raw = document.getElementById('inputEditor').value.trim();
  const size = new Blob([raw]).size;
  document.getElementById('statSize').textContent = size < 1024 ? size + ' B' : (size/1024).toFixed(1) + ' KB';
  document.getElementById('statLines').textContent = raw.split('\n').length;
  if (raw) autoFormat(raw);
  else { clearOutput(); setStatus('idle', '● Waiting'); }
}

function autoFormat(raw) {
  try {
    parsedJson = JSON.parse(raw);
    formattedOutput = JSON.stringify(parsedJson, null, indent);
    renderOutput(parsedJson, formattedOutput);
    setStatus('valid', '✓ Valid JSON');
    updateStats(parsedJson);
    document.getElementById('errorBox').style.display = 'none';
  } catch(e) {
    parsedJson = null;
    formattedOutput = '';
    setStatus('invalid', '✗ Invalid');
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('errorBox').textContent = '⚠ ' + e.message;
    document.getElementById('jsonOutput').innerHTML = '';
    document.getElementById('statKeys').textContent = '-';
    document.getElementById('statDepth').textContent = '-';
    document.getElementById('statItems').textContent = '-';
  }
}

function format() { onInput(); }

function minify() {
  const raw = document.getElementById('inputEditor').value.trim();
  try {
    const obj = JSON.parse(raw);
    const min = JSON.stringify(obj);
    document.getElementById('inputEditor').value = min;
    onInput();
  } catch(e) {}
}

function sortKeys() {
  try {
    const raw = document.getElementById('inputEditor').value.trim();
    const obj = JSON.parse(raw);
    const sorted = sortObj(obj);
    document.getElementById('inputEditor').value = JSON.stringify(sorted, null, indent);
    onInput();
  } catch(e) {}
}

function sortObj(obj) {
  if (Array.isArray(obj)) return obj.map(sortObj);
  if (obj && typeof obj === 'object') {
    return Object.keys(obj).sort().reduce((acc, k) => { acc[k] = sortObj(obj[k]); return acc; }, {});
  }
  return obj;
}

function changeIndent(d) {
  indent = Math.max(1, Math.min(8, indent + d));
  document.getElementById('indentVal').textContent = indent;
  if (parsedJson) { formattedOutput = JSON.stringify(parsedJson, null, indent); renderOutput(parsedJson, formattedOutput); }
}

// ── RENDER ──────────────────────────────────────────────────
function renderOutput(obj, formatted) {
  if (currentView === 'code') {
    document.getElementById('jsonOutput').innerHTML = syntaxHighlight(formatted);
    document.getElementById('jsonOutput').style.display = 'block';
    document.getElementById('treeOutput').style.display = 'none';
  } else {
    document.getElementById('jsonOutput').style.display = 'none';
    document.getElementById('treeOutput').style.display = 'block';
    document.getElementById('treeOutput').innerHTML = renderTree(obj, '');
  }
}

function syntaxHighlight(json) {
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (match) => {
    if (/^"/.test(match)) {
      if (/:$/.test(match)) return `<span class="jk">${escHtml(match)}</span>`;
      return `<span class="js">${escHtml(match)}</span>`;
    }
    if (/true|false/.test(match)) return `<span class="jb">${match}</span>`;
    if (/null/.test(match)) return `<span class="jnull">${match}</span>`;
    return `<span class="jn">${match}</span>`;
  });
}

function renderTree(obj, key) {
  if (obj === null) return `<div class="tree-line">${key ? `<span class="tree-key">${key}: </span>` : ''}<span class="tree-val-null">null</span></div>`;
  if (typeof obj === 'boolean') return `<div class="tree-line">${key ? `<span class="tree-key">${key}: </span>` : ''}<span class="tree-val-bool">${obj}</span></div>`;
  if (typeof obj === 'number') return `<div class="tree-line">${key ? `<span class="tree-key">${key}: </span>` : ''}<span class="tree-val-num">${obj}</span></div>`;
  if (typeof obj === 'string') return `<div class="tree-line">${key ? `<span class="tree-key">${key}: </span>` : ''}<span class="tree-val-str">"${escHtml(obj)}"</span></div>`;
  if (Array.isArray(obj)) {
    const items = obj.map((v, i) => `<div class="tree-node">${renderTree(v, i)}</div>`).join('');
    return `<div class="tree-line"><span class="tree-toggle">▾</span>${key ? `<span class="tree-key">${key}</span>` : ''}<span class="tree-type-badge">Array[${obj.length}]</span></div><div class="tree-node">${items}</div>`;
  }
  const items = Object.entries(obj).map(([k,v]) => `<div class="tree-node">${renderTree(v, k)}</div>`).join('');
  return `<div class="tree-line"><span class="tree-toggle">▾</span>${key ? `<span class="tree-key">${key}</span>` : ''}<span class="tree-type-badge">Object{${Object.keys(obj).length}}</span></div><div class="tree-node">${items}</div>`;
}

function setView(v) {
  currentView = v;
  ['code','tree'].forEach(id => document.getElementById('vbtn-' + id).classList.toggle('active', id === v));
  if (parsedJson) renderOutput(parsedJson, formattedOutput);
}

// ── STATS ───────────────────────────────────────────────────
function updateStats(obj) {
  let keys = 0, items = 0, depth = 0;
  function walk(o, d) {
    depth = Math.max(depth, d);
    if (Array.isArray(o)) { items += o.length; o.forEach(v => walk(v, d+1)); }
    else if (o && typeof o === 'object') {
      keys += Object.keys(o).length;
      Object.values(o).forEach(v => walk(v, d+1));
    }
  }
  walk(obj, 1);
  document.getElementById('statKeys').textContent = keys;
  document.getElementById('statDepth').textContent = depth;
  document.getElementById('statItems').textContent = items;
}

// ── MISC ────────────────────────────────────────────────────
function clearAll() {
  document.getElementById('inputEditor').value = '';
  clearOutput(); setStatus('idle', '● Waiting');
  parsedJson = null; formattedOutput = '';
  ['statSize','statLines','statKeys','statDepth','statItems'].forEach(id => document.getElementById(id).textContent = '-');
}

function clearOutput() {
  document.getElementById('jsonOutput').innerHTML = '';
  document.getElementById('treeOutput').innerHTML = '';
  document.getElementById('errorBox').style.display = 'none';
}

async function pasteInput() {
  try { const t = await navigator.clipboard.readText(); document.getElementById('inputEditor').value = t; onInput(); } catch(e) {}
}

function copyOutput() {
  if (formattedOutput) navigator.clipboard.writeText(formattedOutput).then(() => showToast('Copied!'));
}

function downloadOutput() {
  if (!formattedOutput) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([formattedOutput], {type:'application/json'}));
  a.download = 'formatted.json'; a.click();
}

function loadSample() {
  document.getElementById('inputEditor').value = JSON.stringify({
    "name": "Querencia Tools","version": "1.0.0","features": ["formatter","validator","tree view"],
    "config": {"indent": 2,"sortKeys": false,"theme": "dark"},"stats": {"users": 1024,"rating": 4.8,"active": true,"legacy": null}
  });
  onInput();
}

function setStatus(cls, text) {
  const b = document.getElementById('statusBadge');
  b.className = 'status-badge ' + cls;
  b.textContent = text;
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastEl;
function showToast(msg) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#1a1a1a;color:#6fa882;padding:10px 18px;border-radius:9px;font-size:0.78rem;font-weight:600;transition:transform 0.22s;z-index:999'; document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(() => toastEl.style.transform = 'translateX(-50%) translateY(60px)', 2000);
}
</script>
</body>
</html>
