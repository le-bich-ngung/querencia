apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.querencia.cuibap"
    defaultConfig {
        applicationId "com.querencia.cuibap"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { signingConfig signingConfigs.debug }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("com.facebook.react:hermes-engine:0.73.6") {
        exclude group: "com.facebook.react"
    }
}
android.applicationVariants.all { variant ->
    variant.packageApplicationProvider.get().doFirst {
        def mergeTaskName = "merge${variant.name.capitalize()}NativeLibs"
        def libDir = new File(buildDir, "intermediates/merged_native_libs/${variant.name}/${mergeTaskName}/out/lib")
        if (libDir.exists()) {
            libDir.eachDir { abiDir ->
                def hermes = new File(abiDir, "libhermes.so")
                def executor = new File(abiDir, "libhermes_executor.so")
                if (hermes.exists() && !executor.exists()) {
                    executor.bytes = hermes.bytes
                }
            }
        }
    }
}