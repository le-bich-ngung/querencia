<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Readability Checker · Querencia Tools</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#fdf9f4;--card:#fff;--border:#e8dfd4;
    --sage:#4a7c59;--sage-pale:#ddeee3;
    --amber:#c17f24;--amber-pale:#fef3dc;
    --red:#c0392b;--red-pale:#fdecea;
    --blue:#2563a8;--blue-pale:#deeafb;
    --black:#1a1208;--gray:#6b5c47;--gray-light:#b8a898;
    --display:'Playfair Display',serif;--body:'Source Serif 4',serif;
  }
  body{background:var(--bg);color:var(--black);font-family:var(--body);min-height:100vh;padding:0 0 60px}

  .header{padding:36px 32px 24px;border-bottom:1px solid var(--border)}
  .header h1{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--black);margin-bottom:4px}
  .header p{color:var(--gray);font-size:0.88rem}

  .main{max-width:900px;margin:0 auto;padding:24px 20px;display:grid;grid-template-columns:1fr 340px;gap:20px}
  @media(max-width:720px){.main{grid-template-columns:1fr}}

  /* TEXT AREA */
  .text-panel{display:flex;flex-direction:column;gap:12px}
  .text-area{width:100%;min-height:320px;padding:18px;border:1.5px solid var(--border);border-radius:12px;font-family:var(--body);font-size:0.95rem;line-height:1.8;color:var(--black);background:var(--card);resize:vertical;outline:none;transition:border-color 0.2s}
  .text-area:focus{border-color:var(--sage)}
  .text-meta{display:flex;gap:16px;font-size:0.78rem;color:var(--gray-light)}

  /* ANALYZE BTN */
  .analyze-btn{padding:11px 28px;background:var(--sage);color:#fff;border:none;border-radius:10px;font-family:var(--display);font-size:0.95rem;font-weight:700;cursor:pointer;transition:background 0.2s;align-self:flex-start}
  .analyze-btn:hover{background:#2f5c3e}

  /* RESULTS */
  .results-panel{display:flex;flex-direction:column;gap:12px}

  /* SCORE CARD */
  .score-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:20px;text-align:center}
  .score-num{font-family:var(--display);font-size:3.5rem;font-weight:700;line-height:1;margin-bottom:6px}
  .score-label{font-size:0.8rem;color:var(--gray);margin-bottom:12px}
  .score-grade{display:inline-block;padding:5px 16px;border-radius:99px;font-size:0.82rem;font-weight:700}

  /* METER */
  .meter-bar{height:8px;border-radius:99px;background:var(--border);margin:8px 0;overflow:hidden}
  .meter-fill{height:100%;border-radius:99px;transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1)}

  /* STAT ITEMS */
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .stat-title{font-size:0.72rem;font-weight:700;color:var(--gray-light);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:0.83rem}
  .stat-row:last-child{border:none}
  .stat-val{font-weight:700;color:var(--black)}

  /* SUGGESTIONS */
  .suggestions{background:var(--amber-pale);border:1px solid rgba(193,127,36,0.3);border-radius:12px;padding:14px 16px}
  .sug-item{font-size:0.82rem;color:var(--black);padding:5px 0;display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid rgba(193,127,36,0.15)}
  .sug-item:last-child{border:none}

  /* HIGHLIGHTED TEXT */
  .highlighted-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .highlighted-text{font-family:var(--body);font-size:0.88rem;line-height:1.9}
  .hl-complex{background:#fde8e8;border-bottom:2px solid var(--red);cursor:help}
  .hl-long{background:#fff3cd;border-bottom:2px solid var(--amber);cursor:help}
  .hl-passive{background:#deeafb;border-bottom:2px solid var(--blue);cursor:help}

  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .legend-item{display:flex;align-items:center;gap:4px;font-size:0.72rem;color:var(--gray)}
  .legend-dot{width:12px;height:4px;border-radius:2px}

  .empty-state{text-align:center;padding:40px 20px;color:var(--gray-light)}
  .empty-state .icon{font-size:2.5rem;margin-bottom:10px}
</style>
</head>
<body>

<div class="header">
  <h1>Readability Checker</h1>
  <p>Kiểm tra văn bản của bạn dễ đọc không — phù hợp trình độ nào</p>
</div>

<div class="main">
  <!-- LEFT: INPUT -->
  <div class="text-panel">
    <textarea id="textInput" class="text-area" placeholder="Dán văn bản của bạn vào đây (tiếng Anh hoặc tiếng Việt)...

Ví dụ: một đoạn bài viết, email, báo cáo, mô tả sản phẩm..." oninput="updateMeta()"></textarea>
    <div class="text-meta">
      <span id="wordCount">0 từ</span>
      <span id="sentCount">0 câu</span>
      <span id="charCount">0 ký tự</span>
      <span id="readTime">~0 phút đọc</span>
    </div>
    <button class="analyze-btn" onclick="analyze()">✦ Phân tích ngay</button>

    <!-- Highlighted -->
    <div class="highlighted-wrap" id="hlWrap" style="display:none">
      <div class="legend">
        <span class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>Từ phức tạp</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--amber)"></span>Câu quá dài</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span>Bị động</span>
      </div>
      <div class="highlighted-text" id="hlText"></div>
    </div>
  </div>

  <!-- RIGHT: RESULTS -->
  <div class="results-panel" id="resultsPanel">
    <div class="empty-state">
      <div class="icon">📖</div>
      <div>Nhập văn bản và nhấn Phân tích</div>
    </div>
  </div>
</div>

<script>
function updateMeta() {
  const text = document.getElementById('textInput').value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const sents = text.trim() ? text.split(/[.!?]+/).filter(s=>s.trim().length>0).length : 0;
  document.getElementById('wordCount').textContent = words + ' từ';
  document.getElementById('sentCount').textContent = sents + ' câu';
  document.getElementById('charCount').textContent = text.length + ' ký tự';
  document.getElementById('readTime').textContent = '~' + Math.max(1, Math.round(words/200)) + ' phút đọc';
}

const COMPLEX_WORDS = ['utilize','implementation','functionality','consequently','subsequently','nevertheless','aforementioned','commencement','termination','demonstrate','approximately','methodology','facilitate','transparency','comprehensive','fundamental','sophisticated','substantial','accordingly','furthermore','notwithstanding','endeavor','utilize','paradigm','leverage','synergy','bandwidth','ecosystem','scalable'];

const PASSIVE_PATTERNS = [/\b(is|are|was|were|be|been|being)\s+\w+ed\b/gi, /\b(được|bị)\s+\w+/g];

function syllableCount(word) {
  word = word.toLowerCase().replace(/[^a-z]/g,'');
  if (word.length <= 3) return 1;
  word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
  word = word.replace(/^y/, '');
  const m = word.match(/[aeiouy]{1,2}/g);
  return m ? m.length : 1;
}

function analyze() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) { alert('Vui lòng nhập văn bản!'); return; }

  const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 2);
  const words = text.split(/\s+/).filter(w => w.length > 0);
  const numSentences = Math.max(sentences.length, 1);
  const numWords = words.length;
  const syllables = words.reduce((acc, w) => acc + syllableCount(w), 0);

  // Flesch Reading Ease
  const flesch = 206.835 - 1.015 * (numWords / numSentences) - 84.6 * (syllables / numWords);
  const score = Math.min(100, Math.max(0, Math.round(flesch)));

  // Avg sentence length
  const avgSentLen = Math.round(numWords / numSentences);
  // Long sentences (>25 words)
  const longSents = sentences.filter(s => s.trim().split(/\s+/).length > 25).length;
  // Complex words
  const complexWords = words.filter(w => COMPLEX_WORDS.includes(w.toLowerCase().replace(/[^a-z]/g,''))).length;
  // Passive voice (rough)
  const passiveCount = (text.match(/\b(is|are|was|were|be|been|being)\s+\w+ed\b/gi) || []).length + (text.match(/\b(được|bị)\s/g) || []).length;
  // Unique words ratio
  const uniqueRatio = Math.round((new Set(words.map(w=>w.toLowerCase())).size / numWords) * 100);

  let grade, gradeColor, scoreColor, meter;
  if (score >= 90)      { grade='Lớp 5 (Rất dễ)'; gradeColor='#27ae60'; scoreColor='#27ae60'; meter=score; }
  else if (score >= 80) { grade='Lớp 6 (Dễ)'; gradeColor='#2ecc71'; scoreColor='#2ecc71'; meter=score; }
  else if (score >= 70) { grade='Lớp 7 (Khá dễ)'; gradeColor='#f39c12'; scoreColor='#f39c12'; meter=score; }
  else if (score >= 60) { grade='Lớp 8–9 (Bình thường)'; gradeColor='#e67e22'; scoreColor='#e67e22'; meter=score; }
  else if (score >= 50) { grade='Lớp 10–12 (Hơi khó)'; gradeColor='#e74c3c'; scoreColor='#e74c3c'; meter=score; }
  else if (score >= 30) { grade='Đại học (Khó)'; gradeColor='#c0392b'; scoreColor='#c0392b'; meter=score; }
  else                  { grade='Chuyên gia (Rất khó)'; gradeColor='#922b21'; scoreColor='#922b21'; meter=score; }

  const suggestions = [];
  if (avgSentLen > 20) suggestions.push({icon:'✂️', text:`Câu trung bình ${avgSentLen} từ — hãy rút ngắn xuống dưới 20 từ/câu`});
  if (longSents > 0) suggestions.push({icon:'📏', text:`${longSents} câu quá dài (>25 từ) — chia nhỏ để dễ đọc hơn`});
  if (complexWords > 2) suggestions.push({icon:'📚', text:`${complexWords} từ phức tạp được phát hiện — dùng từ đơn giản hơn`});
  if (passiveCount > 3) suggestions.push({icon:'🔄', text:`${passiveCount} cấu trúc bị động — chuyển sang chủ động để tự nhiên hơn`});
  if (uniqueRatio < 40) suggestions.push({icon:'🔁', text:'Nhiều từ bị lặp lại — thêm từ đồng nghĩa để đa dạng hơn'});
  if (!suggestions.length) suggestions.push({icon:'✅', text:'Văn bản của bạn rất tốt! Tiếp tục giữ phong cách này.'});

  document.getElementById('resultsPanel').innerHTML = `
    <div class="score-card">
      <div class="score-num" style="color:${scoreColor}">${score}</div>
      <div class="score-label">Flesch Reading Ease Score</div>
      <div class="meter-bar"><div class="meter-fill" style="width:${meter}%;background:${scoreColor}"></div></div>
      <span class="score-grade" style="background:${gradeColor}22;color:${gradeColor}">${grade}</span>
    </div>

    <div class="stat-card">
      <div class="stat-title">Thống kê</div>
      ${[
        ['Số từ', numWords],
        ['Số câu', numSentences],
        ['Câu dài (>25 từ)', longSents],
        ['Từ/câu trung bình', avgSentLen],
        ['Từ phức tạp', complexWords],
        ['Cấu trúc bị động', passiveCount],
        ['Tỉ lệ từ duy nhất', uniqueRatio + '%'],
        ['Thời gian đọc', '~' + Math.max(1,Math.round(numWords/200)) + ' phút'],
      ].map(([k,v])=>`<div class="stat-row"><span>${k}</span><span class="stat-val">${v}</span></div>`).join('')}
    </div>

    <div class="suggestions">
      <div class="stat-title" style="color:var(--amber)">💡 Gợi ý cải thiện</div>
      ${suggestions.map(s=>`<div class="sug-item"><span>${s.icon}</span><span>${s.text}</span></div>`).join('')}
    </div>`;

  // Highlight text
  let highlighted = text;
  highlighted = highlighted.replace(/([^.!?]*[.!?])/g, (match) => {
    const wordCount = match.trim().split(/\s+/).length;
    return wordCount > 25 ? `<span class="hl-long" title="Câu quá dài (${wordCount} từ)">${match}</span>` : match;
  });
  COMPLEX_WORDS.forEach(w => {
    highlighted = highlighted.replace(new RegExp(`\\b${w}\\b`, 'gi'), `<span class="hl-complex" title="Từ phức tạp">$&</span>`);
  });
  highlighted = highlighted.replace(/\b(is|are|was|were|be|been|being)\s+\w+ed\b/gi, m => `<span class="hl-passive" title="Bị động">${m}</span>`);

  document.getElementById('hlText').innerHTML = highlighted.replace(/\n/g,'<br/>');
  document.getElementById('hlWrap').style.display = 'block';
}
</script>
</body>
</html>
