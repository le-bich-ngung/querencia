<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Base64 Tool — Querencia</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f5f1; --white: #fff; --panel: #f0ece6; --border: #e0dbd3;
  --black: #1a1816; --gray: #8a7f74; --gray-light: #c0b8b0;
  --accent: #4a7c59; --accent-pale: #e8f2ec; --accent-light: #6fa882;
  --font: 'Plus Jakarta Sans', sans-serif; --mono: 'DM Mono', monospace;
}
body { font-family: var(--font); background: var(--bg); color: var(--black); min-height: 100vh; padding: 28px 20px; }
.page-header { text-align: center; margin-bottom: 28px; }
.page-header h1 { font-size: 1.5rem; font-weight: 700; }
.page-header h1 span { color: var(--accent); }
.page-header p { font-size: 0.78rem; color: var(--gray); margin-top: 4px; }
.container { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Cards */
.card { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
.card-title { padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); }
.card-body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }

/* Textarea */
.field-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray-light); margin-bottom: 6px; }
textarea.field {
  width: 100%; padding: 12px 14px; background: var(--panel); border: 1.5px solid var(--border);
  border-radius: 10px; font-family: var(--mono); font-size: 0.84rem; line-height: 1.7;
  color: var(--black); outline: none; resize: vertical; min-height: 80px;
}
textarea.field:focus { border-color: var(--accent); }
textarea.field::placeholder { color: var(--gray-light); }

/* Buttons */
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--border);
  background: none; color: var(--gray); font-family: var(--font); font-size: 0.76rem;
  font-weight: 600; cursor: pointer; transition: all 0.14s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #3d6b4a; }
.btn.sm { padding: 5px 10px; font-size: 0.68rem; }

/* Error/info */
.info-box { padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; }
.info-box.error { background: rgba(192,57,43,0.08); color: #c0392b; border: 1px solid rgba(192,57,43,0.2); }
.info-box.success { background: var(--accent-pale); color: var(--accent); border: 1px solid #b8d9c4; }
.info-box { display: none; }

/* Mode toggle */
.mode-toggle { display: flex; background: var(--panel); border-radius: 9px; padding: 3px; gap: 3px; align-self: flex-start; }
.mbtn { padding: 6px 14px; border: none; border-radius: 6px; background: none;
  font-family: var(--font); font-size: 0.75rem; font-weight: 600; color: var(--gray);
  cursor: pointer; transition: all 0.13s; }
.mbtn.active { background: var(--white); color: var(--black); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

/* Stats */
.stats-row { display: flex; gap: 12px; flex-wrap: wrap; }
.stat { font-size: 0.68rem; color: var(--gray); }
.stat span { color: var(--black); font-weight: 600; font-family: var(--mono); }

/* Timezone table */
.tz-input-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.tz-field-wrap { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 160px; }
input.tz-input, select.tz-select {
  padding: 9px 12px; background: var(--panel); border: 1.5px solid var(--border);
  border-radius: 9px; font-family: var(--font); font-size: 0.85rem; color: var(--black); outline: none;
}
input.tz-input:focus, select.tz-select:focus { border-color: var(--accent); }
.tz-table { width: 100%; border-collapse: collapse; }
.tz-table th { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gray-light); padding: 8px 12px; text-align: left; border-bottom: 1.5px solid var(--border); }
.tz-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.82rem; vertical-align: middle; }
.tz-table tr:last-child td { border-bottom: none; }
.tz-table tr:hover td { background: var(--panel); }
.tz-name { font-weight: 600; color: var(--black); }
.tz-offset { font-family: var(--mono); font-size: 0.75rem; color: var(--gray); }
.tz-time { font-family: var(--mono); font-size: 0.88rem; font-weight: 500; color: var(--accent); }
.tz-date { font-size: 0.7rem; color: var(--gray); }

/* Image b64 */
.image-preview { max-width: 100%; max-height: 200px; border-radius: 8px; display: none; margin-top: 4px; }
</style>
</head>
<body>

<div class="page-header">
  <h1>Encode / <span>Decode</span> Tools</h1>
  <p>Base64, URL, HTML encoding — and Timezone Converter</p>
</div>

<div class="container">

  <!-- BASE64 -->
  <div class="card">
    <div class="card-title">Base64 Encoder / Decoder</div>
    <div class="card-body">
      <div class="mode-toggle">
        <button class="mbtn active" id="b64-encode" onclick="setB64Mode('encode')">Encode</button>
        <button class="mbtn" id="b64-decode" onclick="setB64Mode('decode')">Decode</button>
      </div>
      <div>
        <div class="field-label" id="b64-in-label">Plain Text</div>
        <textarea class="field" id="b64Input" placeholder="Type or paste text here…" oninput="runB64()"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="runB64()">Convert</button>
        <button class="btn" onclick="swapB64()">⇄ Swap</button>
        <button class="btn" onclick="clearB64()">Clear</button>
        <label class="btn" style="cursor:pointer">📎 Image to Base64<input type="file" accept="image/*" style="display:none" onchange="imageToB64(this)"/></label>
      </div>
      <div class="info-box" id="b64Error"></div>
      <div>
        <div class="field-label" id="b64-out-label">Base64</div>
        <textarea class="field" id="b64Output" placeholder="Result will appear here…" readonly></textarea>
        <img id="b64Preview" class="image-preview"/>
      </div>
      <div class="stats-row">
        <span class="stat">Input: <span id="b64InSize">0</span> chars</span>
        <span class="stat">Output: <span id="b64OutSize">0</span> chars</span>
        <span class="stat">Ratio: <span id="b64Ratio">—</span></span>
      </div>
      <div class="btn-row">
        <button class="btn sm" onclick="copyB64()">⎘ Copy Output</button>
        <button class="btn sm" onclick="downloadB64()">↓ Download</button>
      </div>
    </div>
  </div>

  <!-- URL ENCODE -->
  <div class="card">
    <div class="card-title">URL Encoder / Decoder</div>
    <div class="card-body">
      <div class="mode-toggle">
        <button class="mbtn active" id="url-encode" onclick="setUrlMode('encode')">Encode</button>
        <button class="mbtn" id="url-decode" onclick="setUrlMode('decode')">Decode</button>
      </div>
      <textarea class="field" id="urlInput" placeholder="Enter URL or text…" oninput="runUrl()"></textarea>
      <textarea class="field" id="urlOutput" placeholder="Result…" readonly></textarea>
      <div class="btn-row">
        <button class="btn sm" onclick="copyField('urlOutput')">⎘ Copy</button>
        <button class="btn sm" onclick="swapUrl()">⇄ Swap</button>
      </div>
    </div>
  </div>

  <!-- HTML ENCODE -->
  <div class="card">
    <div class="card-title">HTML Encoder / Decoder</div>
    <div class="card-body">
      <div class="mode-toggle">
        <button class="mbtn active" id="html-encode" onclick="setHtmlMode('encode')">Encode</button>
        <button class="mbtn" id="html-decode" onclick="setHtmlMode('decode')">Decode</button>
      </div>
      <textarea class="field" id="htmlInput" placeholder="Enter text with HTML entities…" oninput="runHtml()"></textarea>
      <textarea class="field" id="htmlOutput" placeholder="Result…" readonly></textarea>
      <div class="btn-row">
        <button class="btn sm" onclick="copyField('htmlOutput')">⎘ Copy</button>
        <button class="btn sm" onclick="swapHtml()">⇄ Swap</button>
      </div>
    </div>
  </div>

  <!-- TIMEZONE -->
  <div class="card">
    <div class="card-title">Timezone Converter</div>
    <div class="card-body">
      <div class="tz-input-row">
        <div class="tz-field-wrap">
          <div class="field-label">Date & Time</div>
          <input type="datetime-local" class="tz-input" id="tzDateInput" oninput="runTz()"/>
        </div>
        <div class="tz-field-wrap">
          <div class="field-label">Source Timezone</div>
          <select class="tz-select" id="tzSource" onchange="runTz()"></select>
        </div>
      </div>
      <table class="tz-table" id="tzTable">
        <thead><tr><th>Timezone</th><th>Time</th><th>Date</th><th>UTC Offset</th></tr></thead>
        <tbody id="tzBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// ============================================================
// BASE64
// ============================================================
let b64Mode = 'encode';
let urlMode = 'encode';
let htmlMode = 'encode';

function setB64Mode(m) {
  b64Mode = m;
  ['encode','decode'].forEach(id => document.getElementById('b64-' + id).classList.toggle('active', id === m));
  document.getElementById('b64-in-label').textContent = m === 'encode' ? 'Plain Text' : 'Base64';
  document.getElementById('b64-out-label').textContent = m === 'encode' ? 'Base64' : 'Plain Text';
  runB64();
}

function runB64() {
  const input = document.getElementById('b64Input').value;
  const errBox = document.getElementById('b64Error');
  const preview = document.getElementById('b64Preview');
  let output = '';
  try {
    if (b64Mode === 'encode') {
      output = btoa(unescape(encodeURIComponent(input)));
    } else {
      output = decodeURIComponent(escape(atob(input.trim())));
      // Check if it's an image
      if (input.trim().startsWith('data:image')) {
        preview.src = input.trim(); preview.style.display = 'block';
      } else preview.style.display = 'none';
    }
    errBox.style.display = 'none';
  } catch(e) {
    errBox.className = 'info-box error'; errBox.style.display = 'block';
    errBox.textContent = '⚠ ' + (b64Mode === 'decode' ? 'Invalid Base64 string' : e.message);
    preview.style.display = 'none';
  }
  document.getElementById('b64Output').value = output;
  document.getElementById('b64InSize').textContent = input.length;
  document.getElementById('b64OutSize').textContent = output.length;
  document.getElementById('b64Ratio').textContent = input.length ? (output.length / input.length).toFixed(2) + '×' : '—';
}

function swapB64() {
  const a = document.getElementById('b64Input').value;
  const b = document.getElementById('b64Output').value;
  document.getElementById('b64Input').value = b;
  document.getElementById('b64Output').value = '';
  b64Mode = b64Mode === 'encode' ? 'decode' : 'encode';
  setB64Mode(b64Mode);
  runB64();
}

function clearB64() {
  document.getElementById('b64Input').value = '';
  document.getElementById('b64Output').value = '';
  document.getElementById('b64Preview').style.display = 'none';
  document.getElementById('b64Error').style.display = 'none';
  ['b64InSize','b64OutSize'].forEach(id => document.getElementById(id).textContent = '0');
  document.getElementById('b64Ratio').textContent = '—';
}

function copyB64() { copyField('b64Output'); }

function downloadB64() {
  const val = document.getElementById('b64Output').value;
  if (!val) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([val], {type:'text/plain'}));
  a.download = 'base64.txt'; a.click();
}

function imageToB64(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    b64Mode = 'encode';
    setB64Mode('encode');
    document.getElementById('b64Input').value = file.name + ' (' + (file.size/1024).toFixed(1) + ' KB)';
    document.getElementById('b64Output').value = e.target.result;
    document.getElementById('b64InSize').textContent = file.size;
    document.getElementById('b64OutSize').textContent = e.target.result.length;
  };
  reader.readAsDataURL(file);
}

// ============================================================
// URL
// ============================================================
function setUrlMode(m) {
  urlMode = m;
  ['encode','decode'].forEach(id => document.getElementById('url-' + id).classList.toggle('active', id === m));
  runUrl();
}
function runUrl() {
  const v = document.getElementById('urlInput').value;
  try {
    document.getElementById('urlOutput').value = urlMode === 'encode' ? encodeURIComponent(v) : decodeURIComponent(v);
  } catch(e) { document.getElementById('urlOutput').value = '⚠ ' + e.message; }
}
function swapUrl() {
  const a = document.getElementById('urlInput').value;
  const b = document.getElementById('urlOutput').value;
  document.getElementById('urlInput').value = b;
  setUrlMode(urlMode === 'encode' ? 'decode' : 'encode');
}

// ============================================================
// HTML
// ============================================================
function setHtmlMode(m) {
  htmlMode = m;
  ['encode','decode'].forEach(id => document.getElementById('html-' + id).classList.toggle('active', id === m));
  runHtml();
}
function runHtml() {
  const v = document.getElementById('htmlInput').value;
  if (htmlMode === 'encode') {
    const d = document.createElement('div'); d.textContent = v;
    document.getElementById('htmlOutput').value = d.innerHTML;
  } else {
    const d = document.createElement('div'); d.innerHTML = v;
    document.getElementById('htmlOutput').value = d.textContent;
  }
}
function swapHtml() {
  const a = document.getElementById('htmlInput').value;
  const b = document.getElementById('htmlOutput').value;
  document.getElementById('htmlInput').value = b;
  setHtmlMode(htmlMode === 'encode' ? 'decode' : 'encode');
}

// ============================================================
// TIMEZONE
// ============================================================
const TIMEZONES = [
  { name: 'UTC', tz: 'UTC' },
  { name: 'New York (EST/EDT)', tz: 'America/New_York' },
  { name: 'Los Angeles (PST/PDT)', tz: 'America/Los_Angeles' },
  { name: 'London (GMT/BST)', tz: 'Europe/London' },
  { name: 'Paris (CET/CEST)', tz: 'Europe/Paris' },
  { name: 'Dubai (GST)', tz: 'Asia/Dubai' },
  { name: 'India (IST)', tz: 'Asia/Kolkata' },
  { name: 'Singapore (SGT)', tz: 'Asia/Singapore' },
  { name: 'Ho Chi Minh (ICT)', tz: 'Asia/Ho_Chi_Minh' },
  { name: 'Tokyo (JST)', tz: 'Asia/Tokyo' },
  { name: 'Sydney (AEST/AEDT)', tz: 'Australia/Sydney' },
  { name: 'São Paulo (BRT/BRST)', tz: 'America/Sao_Paulo' },
];

function initTz() {
  const sel = document.getElementById('tzSource');
  sel.innerHTML = TIMEZONES.map(t => `<option value="${t.tz}">${t.name}</option>`).join('');
  sel.value = 'Asia/Ho_Chi_Minh';

  // Set current time
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('tzDateInput').value =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  runTz();
}

function runTz() {
  const rawInput = document.getElementById('tzDateInput').value;
  const sourceTz = document.getElementById('tzSource').value;
  if (!rawInput) return;

  // Parse the input as if it's in the source timezone
  // We use a trick: create date in UTC then offset by source TZ
  const inputDate = new Date(rawInput);

  const tbody = document.getElementById('tzBody');
  tbody.innerHTML = TIMEZONES.map(t => {
    const timeStr = inputDate.toLocaleTimeString('en-US', { timeZone: t.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const dateStr = inputDate.toLocaleDateString('en-US', { timeZone: t.tz, weekday: 'short', month: 'short', day: 'numeric' });
    const offset = getOffset(t.tz, inputDate);
    return `<tr>
      <td><div class="tz-name">${t.name}</div></td>
      <td><div class="tz-time">${timeStr}</div></td>
      <td><div class="tz-date">${dateStr}</div></td>
      <td><div class="tz-offset">${offset}</div></td>
    </tr>`;
  }).join('');
}

function getOffset(tz, date) {
  const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
  const tzDate  = new Date(date.toLocaleString('en-US', { timeZone: tz }));
  const diff = (tzDate - utcDate) / 3600000;
  const sign = diff >= 0 ? '+' : '-';
  const abs = Math.abs(diff);
  const h = Math.floor(abs), m = Math.round((abs % 1) * 60);
  return `UTC${sign}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

// ============================================================
// UTILS
// ============================================================
function copyField(id) {
  const val = document.getElementById(id).value;
  if (val) navigator.clipboard.writeText(val).then(() => showToast('Copied!'));
}

let toastEl;
function showToast(msg) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#1a1816;color:#6fa882;padding:10px 18px;border-radius:9px;font-size:0.78rem;font-weight:600;transition:transform 0.22s;z-index:999'; document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(() => toastEl.style.transform = 'translateX(-50%) translateY(60px)', 2000);
}

window.addEventListener('DOMContentLoaded', initTz);
</script>
</body>
</html>
