<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Image Editor - Querencia</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0f0f;
  --panel: #181818;
  --panel2: #202020;
  --border: #2a2a2a;
  --accent: #4a7c59;
  --accent-light: #6fa882;
  --white: #f0f0ee;
  --gray: #888;
  --gray-light: #555;
  --font: 'Plus Jakarta Sans', sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--white);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── TOPBAR ─────────────────────────────────────────── */
.topbar {
  height: 52px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}

.topbar-logo {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--white);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
}
.topbar-logo span { color: var(--accent-light); }

.topbar-sep { width: 1px; height: 24px; background: var(--border); }

.top-btn {
  padding: 6px 14px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: none;
  color: var(--gray);
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.top-btn:hover { border-color: var(--accent); color: var(--accent-light); }
.top-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.top-btn.primary:hover { background: #3d6b4a; }
.top-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* Format selector */
.format-select {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--gray);
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 600;
  padding: 6px 10px;
  cursor: pointer;
  outline: none;
}

/* ── MAIN LAYOUT ─────────────────────────────────────── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── LEFT TOOLS SIDEBAR ──────────────────────────────── */
.tools-sidebar {
  width: 56px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 4px;
  flex-shrink: 0;
}

.tool-icon {
  width: 40px;
  height: 40px;
  border-radius: 9px;
  border: none;
  background: none;
  color: var(--gray);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  transition: all 0.15s;
  position: relative;
}
.tool-icon:hover { background: var(--panel2); color: var(--white); }
.tool-icon.active { background: var(--accent); color: #fff; }
.tool-icon[title]:hover::after {
  content: attr(title);
  position: absolute;
  left: 52px;
  background: #333;
  color: #fff;
  padding: 4px 8px;
  border-radius: 5px;
  font-size: 0.72rem;
  font-weight: 600;
  white-space: nowrap;
  pointer-events: none;
  z-index: 100;
}

/* ── CANVAS AREA ─────────────────────────────────────── */
.canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(circle at 20% 50%, rgba(74,124,89,0.04) 0%, transparent 50%),
    repeating-conic-gradient(#1a1a1a 0% 25%, #141414 0% 50%) 0 0 / 20px 20px;
}

.canvas-wrap {
  position: relative;
  display: inline-block;
}

#mainCanvas {
  display: block;
  max-width: 100%;
  max-height: calc(100vh - 52px - 40px);
  cursor: crosshair;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 24px 80px rgba(0,0,0,0.6);
}

.canvas-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--gray-light);
  text-align: center;
}
.canvas-empty-icon { font-size: 3rem; opacity: 0.4; }
.canvas-empty h3 { font-size: 1rem; font-weight: 600; color: var(--gray); }
.canvas-empty p { font-size: 0.82rem; line-height: 1.6; max-width: 280px; }
.upload-area {
  border: 1.5px dashed var(--border);
  border-radius: 16px;
  padding: 32px 48px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.upload-area:hover { border-color: var(--accent); background: rgba(74,124,89,0.05); }
.upload-btn-inner {
  padding: 10px 24px;
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 700;
}

/* zoom info */
.zoom-info {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 0.72rem;
  color: var(--gray);
  font-weight: 600;
  pointer-events: none;
}

/* crop overlay */
#cropOverlay {
  position: absolute;
  border: 2px solid var(--accent-light);
  background: transparent;
  display: none;
  pointer-events: none;
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
}

/* ── RIGHT PANEL ─────────────────────────────────────── */
.right-panel {
  width: 260px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}

.panel-section {
  border-bottom: 1px solid var(--border);
  padding: 16px;
}
.panel-section:last-child { border-bottom: none; }

.panel-title {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gray-light);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Sliders */
.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.slider-label {
  font-size: 0.75rem;
  color: var(--gray);
  width: 80px;
  flex-shrink: 0;
}
.slider-row input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  height: 3px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent-light);
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--accent);
}
.slider-val {
  font-size: 0.72rem;
  color: var(--accent-light);
  width: 28px;
  text-align: right;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* Filters */
.filter-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.filter-btn {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: none;
  cursor: pointer;
  padding: 0;
  overflow: hidden;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.filter-btn.active { border-color: var(--accent-light); }
.filter-btn:hover:not(.active) { border-color: var(--gray-light); }
.filter-preview {
  width: 100%;
  height: 40px;
  display: block;
}
.filter-name {
  font-size: 0.62rem;
  font-weight: 600;
  color: var(--gray);
  padding: 4px 2px;
  text-align: center;
}
.filter-btn.active .filter-name { color: var(--accent-light); }

/* Rotate / Flip */
.action-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.action-btn {
  padding: 9px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: none;
  color: var(--gray);
  font-family: var(--font);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent-light); background: rgba(74,124,89,0.08); }

/* Resize */
.resize-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.resize-row input {
  flex: 1;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--white);
  font-family: var(--font);
  font-size: 0.82rem;
  padding: 7px 10px;
  outline: none;
  width: 0;
}
.resize-row input:focus { border-color: var(--accent); }
.resize-row label { font-size: 0.72rem; color: var(--gray); flex-shrink: 0; }
.resize-row span { font-size: 0.72rem; color: var(--gray-light); }

.apply-btn {
  width: 100%;
  padding: 9px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--white);
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 4px;
}
.apply-btn:hover { border-color: var(--accent); color: var(--accent-light); }

/* scrollbar */
.right-panel::-webkit-scrollbar { width: 3px; }
.right-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

/* reset btn */
.reset-link {
  font-size: 0.68rem;
  color: var(--gray-light);
  cursor: pointer;
  text-decoration: underline;
}
.reset-link:hover { color: var(--accent-light); }

/* history info */
.img-info {
  font-size: 0.72rem;
  color: var(--gray-light);
  line-height: 1.8;
}
.img-info span { color: var(--gray); }
</style>
</head>
<body>

<!-- ── TOPBAR ─────────────────────────────────────────────── -->
<div class="topbar">
  <div class="topbar-logo">Image <span>Editor</span></div>
  <div class="topbar-sep"></div>
  <button class="top-btn" onclick="triggerUpload()">📂 Open</button>
  <button class="top-btn" id="undoBtn" onclick="undo()" disabled>↩ Undo</button>
  <button class="top-btn" id="resetBtn" onclick="resetImage()" disabled>⟳ Reset</button>

  <div class="topbar-right">
    <select class="format-select" id="formatSelect">
      <option value="jpeg">JPG</option>
      <option value="png">PNG</option>
      <option value="webp">WebP</option>
    </select>
    <button class="top-btn primary" id="saveBtn" onclick="saveImage()" disabled>↓ Download</button>
  </div>
</div>

<div class="main">

  <!-- ── LEFT TOOLS ──────────────────────────────────────── -->
  <div class="tools-sidebar">
    <button class="tool-icon active" title="Adjust" onclick="setTool('adjust')" id="tool-adjust">⚙</button>
    <button class="tool-icon" title="Filters" onclick="setTool('filter')" id="tool-filter">✦</button>
    <button class="tool-icon" title="Crop" onclick="setTool('crop')" id="tool-crop">⊡</button>
    <button class="tool-icon" title="Resize" onclick="setTool('resize')" id="tool-resize">⤡</button>
    <button class="tool-icon" title="Rotate & Flip" onclick="setTool('rotate')" id="tool-rotate">↻</button>
  </div>

  <!-- ── CANVAS ──────────────────────────────────────────── -->
  <div class="canvas-area" id="canvasArea">
    <div class="canvas-empty" id="emptyState">
      <div class="upload-area" onclick="triggerUpload()" id="dropZone">
        <div class="canvas-empty-icon">🖼</div>
        <div>
          <div class="upload-btn-inner">Choose Image</div>
        </div>
        <div class="canvas-empty-icon" style="font-size:0.82rem;color:var(--gray-light);opacity:1">
          or drag & drop here<br/>JPG · PNG · WebP · GIF
        </div>
      </div>
    </div>

    <div class="canvas-wrap" id="canvasWrap" style="display:none">
      <canvas id="mainCanvas"></canvas>
      <div id="cropOverlay"></div>
    </div>
    <div class="zoom-info" id="zoomInfo" style="display:none">100%</div>
  </div>

  <!-- ── RIGHT PANEL ─────────────────────────────────────── -->
  <div class="right-panel" id="rightPanel">

    <!-- Adjust -->
    <div class="panel-section" id="panel-adjust">
      <div class="panel-title">
        Adjustments
        <span class="reset-link" onclick="resetAdjust()">Reset</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Brightness</span>
        <input type="range" id="sl-brightness" min="-100" max="100" value="0" oninput="updateSlider('brightness',this)"/>
        <span class="slider-val" id="val-brightness">0</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Contrast</span>
        <input type="range" id="sl-contrast" min="-100" max="100" value="0" oninput="updateSlider('contrast',this)"/>
        <span class="slider-val" id="val-contrast">0</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Saturation</span>
        <input type="range" id="sl-saturation" min="-100" max="100" value="0" oninput="updateSlider('saturation',this)"/>
        <span class="slider-val" id="val-saturation">0</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Exposure</span>
        <input type="range" id="sl-exposure" min="-100" max="100" value="0" oninput="updateSlider('exposure',this)"/>
        <span class="slider-val" id="val-exposure">0</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Warmth</span>
        <input type="range" id="sl-warmth" min="-100" max="100" value="0" oninput="updateSlider('warmth',this)"/>
        <span class="slider-val" id="val-warmth">0</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Sharpen</span>
        <input type="range" id="sl-sharpen" min="0" max="100" value="0" oninput="updateSlider('sharpen',this)"/>
        <span class="slider-val" id="val-sharpen">0</span>
      </div>
    </div>

    <!-- Filters -->
    <div class="panel-section" id="panel-filter" style="display:none">
      <div class="panel-title">Filters</div>
      <div class="filter-grid" id="filterGrid"></div>
    </div>

    <!-- Crop -->
    <div class="panel-section" id="panel-crop" style="display:none">
      <div class="panel-title">Crop</div>
      <div class="action-grid" style="margin-bottom:10px">
        <button class="action-btn" onclick="setCropAspect(null)">✦ Free</button>
        <button class="action-btn" onclick="setCropAspect(1)">□ 1:1</button>
        <button class="action-btn" onclick="setCropAspect(16/9)">▬ 16:9</button>
        <button class="action-btn" onclick="setCropAspect(4/3)">▭ 4:3</button>
      </div>
      <button class="apply-btn" onclick="applyCrop()">Apply Crop</button>
      <button class="apply-btn" style="margin-top:6px;color:var(--gray)" onclick="cancelCrop()">Cancel</button>
    </div>

    <!-- Resize -->
    <div class="panel-section" id="panel-resize" style="display:none">
      <div class="panel-title">Resize</div>
      <div class="resize-row">
        <label>W</label>
        <input type="number" id="resize-w" placeholder="Width" oninput="syncResize('w')"/>
        <span>px</span>
      </div>
      <div class="resize-row">
        <label>H</label>
        <input type="number" id="resize-h" placeholder="Height" oninput="syncResize('h')"/>
        <span>px</span>
      </div>
      <div class="slider-row" style="margin-top:4px">
        <span class="slider-label" style="width:auto;font-size:0.72rem;color:var(--gray)">Lock ratio</span>
        <input type="checkbox" id="lock-ratio" checked style="accent-color:var(--accent);cursor:pointer"/>
      </div>
      <button class="apply-btn" onclick="applyResize()">Apply Resize</button>
    </div>

    <!-- Rotate -->
    <div class="panel-section" id="panel-rotate" style="display:none">
      <div class="panel-title">Rotate & Flip</div>
      <div class="action-grid">
        <button class="action-btn" onclick="rotate(-90)">↺ Left 90°</button>
        <button class="action-btn" onclick="rotate(90)">↻ Right 90°</button>
        <button class="action-btn" onclick="flip('h')">↔ Flip H</button>
        <button class="action-btn" onclick="flip('v')">↕ Flip V</button>
      </div>
    </div>

    <!-- Image info -->
    <div class="panel-section" id="panel-info" style="display:none">
      <div class="panel-title">Image Info</div>
      <div class="img-info" id="imgInfo"></div>
    </div>

  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(this)"/>

<script>
// ============================================================
// STATE
// ============================================================
let originalImg = null;     // Original ImageData
let workingCanvas = null;   // Off-screen canvas with all transforms
let displayCanvas = null;
let ctx = null;

let adjust = { brightness:0, contrast:0, saturation:0, exposure:0, warmth:0, sharpen:0 };
let currentFilter = 'none';
let history = [];           // Stack of ImageData snapshots
let cropActive = false;
let cropStart = null, cropRect = null, cropAspect = null;
let isDragging = false;

const FILTERS = [
  { id:'none',      name:'Original',  fn: null },
  { id:'bw',        name:'B&W',       fn: toBW },
  { id:'sepia',     name:'Sepia',     fn: toSepia },
  { id:'vintage',   name:'Vintage',   fn: toVintage },
  { id:'cool',      name:'Cool',      fn: toCool },
  { id:'warm',      name:'Warm',      fn: toWarm },
  { id:'fade',      name:'Fade',      fn: toFade },
  { id:'vivid',     name:'Vivid',     fn: toVivid },
  { id:'matte',     name:'Matte',     fn: toMatte },
];

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  displayCanvas = document.getElementById('mainCanvas');
  ctx = displayCanvas.getContext('2d');
  workingCanvas = document.createElement('canvas');
  initFilterPreviews();
  initDrop();
});

function initDrop() {
  const area = document.getElementById('canvasArea');
  area.addEventListener('dragover', e => { e.preventDefault(); });
  area.addEventListener('drop', e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  });
}

// ============================================================
// LOAD IMAGE
// ============================================================
function triggerUpload() { document.getElementById('fileInput').click(); }

function loadImage(input) {
  if (!input.files[0]) return;
  loadFile(input.files[0]);
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      workingCanvas.width = img.naturalWidth;
      workingCanvas.height = img.naturalHeight;
      const wCtx = workingCanvas.getContext('2d');
      wCtx.drawImage(img, 0, 0);
      originalImg = wCtx.getImageData(0, 0, workingCanvas.width, workingCanvas.height);
      history = [];
      resetAdjust(false);
      currentFilter = 'none';
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.id === 'none'));
      showCanvas();
      applyAll();
      updateInfo(file);
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function showCanvas() {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('canvasWrap').style.display = 'inline-block';
  document.getElementById('zoomInfo').style.display = 'block';
  document.getElementById('panel-info').style.display = 'block';
}

function updateInfo(file) {
  const info = document.getElementById('imgInfo');
  info.innerHTML = `
    <div>Size: <span>${workingCanvas.width} × ${workingCanvas.height}px</span></div>
    <div>File: <span>${file ? file.name : '-'}</span></div>
    <div>Format: <span>${(file?.type || '').replace('image/','').toUpperCase() || '-'}</span></div>
  `;
  document.getElementById('zoomInfo').textContent =
    Math.round((displayCanvas.width / workingCanvas.width) * 100) + '%';
  document.getElementById('resize-w').value = workingCanvas.width;
  document.getElementById('resize-h').value = workingCanvas.height;
}

// ============================================================
// APPLY ALL (render pipeline)
// ============================================================
function applyAll() {
  if (!originalImg) return;

  // Start from original
  const wCtx = workingCanvas.getContext('2d');
  wCtx.putImageData(originalImg, 0, 0);

  let data = wCtx.getImageData(0, 0, workingCanvas.width, workingCanvas.height);
  let px = data.data;

  // Apply filter first
  const filterFn = FILTERS.find(f => f.id === currentFilter)?.fn;
  if (filterFn) filterFn(px);

  // Apply adjustments
  applyAdjustments(px);

  wCtx.putImageData(data, 0, 0);

  // Draw to display canvas (fit to view)
  fitDisplay();
}

function fitDisplay() {
  const area = document.getElementById('canvasArea');
  const maxW = area.clientWidth - 80;
  const maxH = area.clientHeight - 60;
  const scale = Math.min(maxW / workingCanvas.width, maxH / workingCanvas.height, 1);

  displayCanvas.width = Math.round(workingCanvas.width * scale);
  displayCanvas.height = Math.round(workingCanvas.height * scale);
  ctx.drawImage(workingCanvas, 0, 0, displayCanvas.width, displayCanvas.height);

  document.getElementById('zoomInfo').textContent = Math.round(scale * 100) + '%';
}

// ============================================================
// ADJUSTMENTS
// ============================================================
function updateSlider(prop, el) {
  adjust[prop] = parseInt(el.value);
  document.getElementById('val-' + prop).textContent = el.value;
  applyAll();
}

function resetAdjust(rerender = true) {
  adjust = { brightness:0, contrast:0, saturation:0, exposure:0, warmth:0, sharpen:0 };
  ['brightness','contrast','saturation','exposure','warmth','sharpen'].forEach(k => {
    const sl = document.getElementById('sl-' + k);
    if (sl) sl.value = 0;
    const vl = document.getElementById('val-' + k);
    if (vl) vl.textContent = '0';
  });
  if (rerender) applyAll();
}

function applyAdjustments(px) {
  const { brightness, contrast, exposure, saturation, warmth, sharpen } = adjust;

  const bFactor = brightness / 100 * 80;
  const cFactor = (contrast + 100) / 100;
  const eFactor = Math.pow(2, exposure / 100 * 2);

  for (let i = 0; i < px.length; i += 4) {
    let r = px[i], g = px[i+1], b = px[i+2];

    // Exposure
    r *= eFactor; g *= eFactor; b *= eFactor;

    // Brightness
    r += bFactor; g += bFactor; b += bFactor;

    // Contrast
    r = (r - 128) * cFactor + 128;
    g = (g - 128) * cFactor + 128;
    b = (b - 128) * cFactor + 128;

    // Warmth
    if (warmth > 0) { r += warmth * 0.5; b -= warmth * 0.4; }
    else { r += warmth * 0.4; b -= warmth * 0.5; }

    // Saturation
    if (saturation !== 0) {
      const gray = 0.299*r + 0.587*g + 0.114*b;
      const s = (saturation + 100) / 100;
      r = gray + (r - gray) * s;
      g = gray + (g - gray) * s;
      b = gray + (b - gray) * s;
    }

    px[i]   = Math.max(0, Math.min(255, r));
    px[i+1] = Math.max(0, Math.min(255, g));
    px[i+2] = Math.max(0, Math.min(255, b));
  }
}

// ============================================================
// FILTERS
// ============================================================
function toBW(px) {
  for (let i = 0; i < px.length; i += 4) {
    const g = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
    px[i] = px[i+1] = px[i+2] = g;
  }
}
function toSepia(px) {
  for (let i = 0; i < px.length; i += 4) {
    const r=px[i],g=px[i+1],b=px[i+2];
    px[i]   = Math.min(255, r*0.393+g*0.769+b*0.189);
    px[i+1] = Math.min(255, r*0.349+g*0.686+b*0.168);
    px[i+2] = Math.min(255, r*0.272+g*0.534+b*0.131);
  }
}
function toVintage(px) {
  for (let i = 0; i < px.length; i += 4) {
    px[i]   = Math.min(255, px[i]*1.1+10);
    px[i+1] = Math.min(255, px[i+1]*0.9+5);
    px[i+2] = Math.min(255, px[i+2]*0.8);
    const g = 0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
    px[i]   = px[i]*0.7+g*0.3;
    px[i+1] = px[i+1]*0.7+g*0.3;
    px[i+2] = px[i+2]*0.7+g*0.3;
  }
}
function toCool(px) {
  for (let i = 0; i < px.length; i += 4) {
    px[i]   = Math.max(0, px[i]-15);
    px[i+2] = Math.min(255, px[i+2]+25);
  }
}
function toWarm(px) {
  for (let i = 0; i < px.length; i += 4) {
    px[i]   = Math.min(255, px[i]+25);
    px[i+2] = Math.max(0, px[i+2]-15);
  }
}
function toFade(px) {
  for (let i = 0; i < px.length; i += 4) {
    px[i]   = px[i]*0.85+30;
    px[i+1] = px[i+1]*0.85+30;
    px[i+2] = px[i+2]*0.85+30;
  }
}
function toVivid(px) {
  for (let i = 0; i < px.length; i += 4) {
    const gray = 0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
    px[i]   = Math.min(255, gray+(px[i]-gray)*1.5);
    px[i+1] = Math.min(255, gray+(px[i+1]-gray)*1.5);
    px[i+2] = Math.min(255, gray+(px[i+2]-gray)*1.5);
  }
}
function toMatte(px) {
  for (let i = 0; i < px.length; i += 4) {
    px[i]   = px[i]*0.9+15;
    px[i+1] = px[i+1]*0.88+12;
    px[i+2] = px[i+2]*0.85+20;
  }
}

function initFilterPreviews() {
  const grid = document.getElementById('filterGrid');
  grid.innerHTML = FILTERS.map(f => `
    <button class="filter-btn ${f.id==='none'?'active':''}" data-id="${f.id}" onclick="applyFilter('${f.id}')">
      <canvas class="filter-preview" id="fprev-${f.id}" width="64" height="40"></canvas>
      <span class="filter-name">${f.name}</span>
    </button>
  `).join('');
}

function updateFilterPreviews() {
  if (!originalImg) return;
  const tmpC = document.createElement('canvas');
  tmpC.width = 64; tmpC.height = 40;
  const tmpCtx = tmpC.getContext('2d');

  FILTERS.forEach(f => {
    const src = document.createElement('canvas');
    src.width = originalImg.width; src.height = originalImg.height;
    const sCtx = src.getContext('2d');
    sCtx.putImageData(originalImg, 0, 0);
    let data = sCtx.getImageData(0, 0, src.width, src.height);
    if (f.fn) f.fn(data.data);
    sCtx.putImageData(data, 0, 0);

    const prev = document.getElementById('fprev-' + f.id);
    if (prev) {
      const pCtx = prev.getContext('2d');
      pCtx.drawImage(src, 0, 0, 64, 40);
    }
  });
}

function applyFilter(id) {
  if (!originalImg) return;
  pushHistory();
  currentFilter = id;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  applyAll();
}

// ============================================================
// ROTATE / FLIP
// ============================================================
function pushHistory() {
  if (!originalImg) return;
  history.push({
    img: new ImageData(new Uint8ClampedArray(originalImg.data), originalImg.width, originalImg.height),
    filter: currentFilter,
    adjust: {...adjust}
  });
  document.getElementById('undoBtn').disabled = false;
}

function undo() {
  if (!history.length) return;
  const prev = history.pop();
  originalImg = prev.img;
  currentFilter = prev.filter;
  adjust = prev.adjust;
  ['brightness','contrast','saturation','exposure','warmth','sharpen'].forEach(k => {
    document.getElementById('sl-'+k).value = adjust[k];
    document.getElementById('val-'+k).textContent = adjust[k];
  });
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.id === currentFilter));
  applyAll();
  document.getElementById('undoBtn').disabled = history.length === 0;
}

function rotate(deg) {
  if (!originalImg) return;
  pushHistory();
  const tmp = document.createElement('canvas');
  const abs = Math.abs(deg);
  if (abs === 90) {
    tmp.width = workingCanvas.height;
    tmp.height = workingCanvas.width;
  } else {
    tmp.width = workingCanvas.width;
    tmp.height = workingCanvas.height;
  }
  const tCtx = tmp.getContext('2d');
  tCtx.translate(tmp.width/2, tmp.height/2);
  tCtx.rotate(deg * Math.PI/180);
  tCtx.drawImage(workingCanvas, -workingCanvas.width/2, -workingCanvas.height/2);

  workingCanvas.width = tmp.width;
  workingCanvas.height = tmp.height;
  workingCanvas.getContext('2d').drawImage(tmp, 0, 0);
  originalImg = workingCanvas.getContext('2d').getImageData(0, 0, workingCanvas.width, workingCanvas.height);
  resetAdjust(false);
  currentFilter = 'none';
  applyAll();
  updateInfo(null);
}

function flip(dir) {
  if (!originalImg) return;
  pushHistory();
  const tmp = document.createElement('canvas');
  tmp.width = workingCanvas.width;
  tmp.height = workingCanvas.height;
  const tCtx = tmp.getContext('2d');
  if (dir === 'h') { tCtx.translate(tmp.width, 0); tCtx.scale(-1, 1); }
  else { tCtx.translate(0, tmp.height); tCtx.scale(1, -1); }
  tCtx.drawImage(workingCanvas, 0, 0);
  workingCanvas.getContext('2d').drawImage(tmp, 0, 0);
  originalImg = workingCanvas.getContext('2d').getImageData(0, 0, workingCanvas.width, workingCanvas.height);
  resetAdjust(false);
  currentFilter = 'none';
  applyAll();
}

// ============================================================
// CROP
// ============================================================
function setCropAspect(ratio) { cropAspect = ratio; }

function startCrop() {
  cropActive = true;
  document.getElementById('cropOverlay').style.display = 'block';
  displayCanvas.style.cursor = 'crosshair';

  displayCanvas.addEventListener('mousedown', onCropStart);
  displayCanvas.addEventListener('mousemove', onCropMove);
  displayCanvas.addEventListener('mouseup', onCropEnd);
}

function onCropStart(e) {
  const rect = displayCanvas.getBoundingClientRect();
  cropStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  isDragging = true;
}

function onCropMove(e) {
  if (!isDragging || !cropStart) return;
  const rect = displayCanvas.getBoundingClientRect();
  let x = e.clientX - rect.left, y = e.clientY - rect.top;

  let w = x - cropStart.x, h = y - cropStart.y;
  if (cropAspect) { h = Math.abs(w) / cropAspect * Math.sign(h); }

  const overlay = document.getElementById('cropOverlay');
  const wrap = document.getElementById('canvasWrap');
  const wRect = wrap.getBoundingClientRect();

  const ox = Math.min(cropStart.x, cropStart.x + w);
  const oy = Math.min(cropStart.y, cropStart.y + h);

  overlay.style.left   = (displayCanvas.getBoundingClientRect().left - wRect.left + ox) + 'px';
  overlay.style.top    = (displayCanvas.getBoundingClientRect().top  - wRect.top  + oy) + 'px';
  overlay.style.width  = Math.abs(w) + 'px';
  overlay.style.height = Math.abs(h) + 'px';

  cropRect = { x: ox, y: oy, w: Math.abs(w), h: Math.abs(h) };
}

function onCropEnd() { isDragging = false; }

function applyCrop() {
  if (!cropRect || !originalImg) return;
  const scale = workingCanvas.width / displayCanvas.width;
  const cx = Math.round(cropRect.x * scale);
  const cy = Math.round(cropRect.y * scale);
  const cw = Math.round(cropRect.w * scale);
  const ch = Math.round(cropRect.h * scale);

  if (cw < 4 || ch < 4) return;

  pushHistory();
  const tmp = document.createElement('canvas');
  tmp.width = cw; tmp.height = ch;
  tmp.getContext('2d').drawImage(workingCanvas, cx, cy, cw, ch, 0, 0, cw, ch);

  workingCanvas.width = cw; workingCanvas.height = ch;
  workingCanvas.getContext('2d').drawImage(tmp, 0, 0);
  originalImg = workingCanvas.getContext('2d').getImageData(0,0,cw,ch);
  cancelCrop();
  applyAll();
  updateInfo(null);
}

function cancelCrop() {
  cropActive = false; cropRect = null; cropStart = null;
  document.getElementById('cropOverlay').style.display = 'none';
  displayCanvas.removeEventListener('mousedown', onCropStart);
  displayCanvas.removeEventListener('mousemove', onCropMove);
  displayCanvas.removeEventListener('mouseup', onCropEnd);
  displayCanvas.style.cursor = 'default';
}

// ============================================================
// RESIZE
// ============================================================
function syncResize(changed) {
  if (!document.getElementById('lock-ratio').checked || !originalImg) return;
  const ratio = originalImg.width / originalImg.height;
  if (changed === 'w') {
    document.getElementById('resize-h').value = Math.round(document.getElementById('resize-w').value / ratio);
  } else {
    document.getElementById('resize-w').value = Math.round(document.getElementById('resize-h').value * ratio);
  }
}

function applyResize() {
  if (!originalImg) return;
  const nw = parseInt(document.getElementById('resize-w').value);
  const nh = parseInt(document.getElementById('resize-h').value);
  if (!nw || !nh || nw < 1 || nh < 1) return;

  pushHistory();
  const tmp = document.createElement('canvas');
  tmp.width = nw; tmp.height = nh;
  tmp.getContext('2d').drawImage(workingCanvas, 0, 0, nw, nh);
  workingCanvas.width = nw; workingCanvas.height = nh;
  workingCanvas.getContext('2d').drawImage(tmp, 0, 0);
  originalImg = workingCanvas.getContext('2d').getImageData(0,0,nw,nh);
  resetAdjust(false);
  currentFilter = 'none';
  applyAll();
  updateInfo(null);
}

// ============================================================
// RESET
// ============================================================
function resetImage() {
  if (!history.length && adjust.brightness===0) return;
  // Reset to first history or current original
  while (history.length > 1) history.shift();
  if (history.length) {
    const first = history[0];
    originalImg = new ImageData(new Uint8ClampedArray(first.img.data), first.img.width, first.img.height);
    workingCanvas.width = originalImg.width;
    workingCanvas.height = originalImg.height;
    history = [];
  }
  resetAdjust(false);
  currentFilter = 'none';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.id === 'none'));
  document.getElementById('undoBtn').disabled = true;
  applyAll();
  updateInfo(null);
}

// ============================================================
// TOOL SWITCHER
// ============================================================
function setTool(tool) {
  document.querySelectorAll('.tool-icon').forEach(b => b.classList.remove('active'));
  document.getElementById('tool-' + tool).classList.add('active');

  ['adjust','filter','crop','resize','rotate'].forEach(t => {
    document.getElementById('panel-' + t).style.display = t === tool ? 'block' : 'none';
  });

  if (tool === 'filter') {
    updateFilterPreviews();
  }
  if (tool === 'crop') {
    startCrop();
  } else {
    cancelCrop();
  }
}

// ============================================================
// SAVE
// ============================================================
function saveImage() {
  if (!originalImg) return;
  const format = document.getElementById('formatSelect').value;
  const quality = format === 'png' ? 1 : 0.92;
  const link = document.createElement('a');
  link.download = 'querencia-edited.' + (format === 'jpeg' ? 'jpg' : format);
  link.href = workingCanvas.toDataURL('image/' + format, quality);
  link.click();
}
