<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Password Generator — Querencia</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --panel: #131313;
  --panel2: #1a1a1a;
  --border: #252525;
  --white: #efefed;
  --gray: #777;
  --gray-light: #444;
  --accent: #4a7c59;
  --accent-light: #6fa882;
  --red: #e05252;
  --yellow: #d4a843;
  --green: #52b87a;
  --font: 'Plus Jakarta Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.wrapper {
  width: 100%;
  max-width: 560px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Header */
.header { text-align: center; margin-bottom: 8px; }
.header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.header h1 span { color: var(--accent-light); }
.header p { font-size: 0.78rem; color: var(--gray); margin-top: 4px; }

/* Password display */
.password-card {
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 24px 20px 20px;
}

.password-display {
  font-family: var(--mono);
  font-size: 1.1rem;
  font-weight: 500;
  color: var(--white);
  word-break: break-all;
  line-height: 1.6;
  min-height: 40px;
  letter-spacing: 0.04em;
  margin-bottom: 16px;
  padding: 12px 16px;
  background: var(--bg);
  border-radius: 10px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.15s;
  position: relative;
}
.password-display:hover { border-color: var(--accent); }

/* Strength bar */
.strength-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.strength-bars {
  display: flex;
  gap: 4px;
  flex: 1;
}
.strength-bar {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  transition: background 0.3s;
}
.strength-label {
  font-size: 0.72rem;
  font-weight: 700;
  width: 64px;
  text-align: right;
}

/* Action buttons */
.action-row {
  display: flex;
  gap: 8px;
}
.action-btn {
  flex: 1;
  padding: 10px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  background: none;
  color: var(--gray);
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent-light); }
.action-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  flex: 1.5;
}
.action-btn.primary:hover { background: #3d6b4a; }
.action-btn.copied { border-color: var(--green); color: var(--green); }

/* Settings card */
.settings-card {
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.section-title {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gray);
}

/* Length slider */
.length-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.length-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.length-val {
  font-family: var(--mono);
  font-size: 1.2rem;
  font-weight: 500;
  color: var(--accent-light);
}
.length-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
}
.length-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent-light);
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--accent);
  cursor: pointer;
}

/* Checkboxes */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.option-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--panel2);
  border: 1.5px solid var(--border);
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.option-item:hover { border-color: var(--accent); }
.option-item.active { border-color: var(--accent); background: rgba(74,124,89,0.08); }
.option-check {
  width: 18px; height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--border);
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
  font-size: 0.7rem;
}
.option-item.active .option-check {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.option-label { font-size: 0.78rem; font-weight: 600; color: var(--white); }
.option-chars { font-family: var(--mono); font-size: 0.62rem; color: var(--gray); margin-top: 1px; }

/* Mode toggle */
.mode-row {
  display: flex;
  background: var(--panel2);
  border-radius: 10px;
  padding: 3px;
  gap: 3px;
}
.mode-btn {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 7px;
  background: none;
  font-family: var(--font);
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--gray);
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.mode-btn.active {
  background: var(--panel);
  color: var(--white);
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

/* Passphrase separator */
.separator-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.separator-row label { font-size: 0.72rem; color: var(--gray); }
.sep-input {
  background: var(--panel2);
  border: 1.5px solid var(--border);
  border-radius: 7px;
  color: var(--white);
  font-family: var(--mono);
  font-size: 0.85rem;
  padding: 6px 10px;
  width: 48px;
  text-align: center;
  outline: none;
}
.sep-input:focus { border-color: var(--accent); }

/* History */
.history-card {
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}
.history-header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.history-list { max-height: 180px; overflow-y: auto; }
.history-list::-webkit-scrollbar { width: 3px; }
.history-list::-webkit-scrollbar-thumb { background: var(--border); }
.history-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
  cursor: pointer;
}
.history-item:last-child { border-bottom: none; }
.history-item:hover { background: var(--panel2); }
.history-pw {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--gray);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.history-copy {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--gray-light);
  font-size: 0.8rem;
  padding: 2px 6px;
  border-radius: 4px;
  transition: all 0.12s;
}
.history-copy:hover { color: var(--accent-light); background: rgba(74,124,89,0.1); }
.history-strength {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.history-empty {
  padding: 20px;
  text-align: center;
  font-size: 0.75rem;
  color: var(--gray-light);
}

/* clear btn */
.clear-history {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.68rem;
  color: var(--gray-light);
  font-family: var(--font);
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  transition: all 0.12s;
}
.clear-history:hover { color: var(--red); }

/* toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent-light);
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 999;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrapper">

  <div class="header">
    <h1>Password <span>Generator</span></h1>
    <p>Strong, random passwords — generated locally, never sent anywhere.</p>
  </div>

  <!-- Password display -->
  <div class="password-card">
    <div class="password-display" id="pwDisplay" onclick="copyPassword()" title="Click to copy">
      Click Generate to create a password
    </div>

    <!-- Strength -->
    <div class="strength-row">
      <div class="strength-bars">
        <div class="strength-bar" id="sb1"></div>
        <div class="strength-bar" id="sb2"></div>
        <div class="strength-bar" id="sb3"></div>
        <div class="strength-bar" id="sb4"></div>
      </div>
      <span class="strength-label" id="strengthLabel" style="color:var(--gray)">—</span>
    </div>

    <div class="action-row">
      <button class="action-btn" id="copyBtn" onclick="copyPassword()">⎘ Copy</button>
      <button class="action-btn primary" onclick="generate()">↻ Generate</button>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings-card">
    <div>
      <div class="section-title" style="margin-bottom:10px">Mode</div>
      <div class="mode-row">
        <button class="mode-btn active" id="mode-random" onclick="setMode('random')">Random</button>
        <button class="mode-btn" id="mode-passphrase" onclick="setMode('passphrase')">Passphrase</button>
        <button class="mode-btn" id="mode-pin" onclick="setMode('pin')">PIN</button>
      </div>
    </div>

    <!-- Random options -->
    <div id="opts-random">
      <div class="length-row">
        <div class="length-header">
          <span class="section-title">Length</span>
          <span class="length-val" id="lenVal">16</span>
        </div>
        <input type="range" class="length-slider" id="lenSlider" min="4" max="64" value="16" oninput="onLenChange()"/>
      </div>

      <div class="options-grid" id="charOptions">
        <div class="option-item active" id="opt-upper" onclick="toggleOpt('upper')">
          <div class="option-check">✓</div>
          <div>
            <div class="option-label">Uppercase</div>
            <div class="option-chars">A–Z</div>
          </div>
        </div>
        <div class="option-item active" id="opt-lower" onclick="toggleOpt('lower')">
          <div class="option-check">✓</div>
          <div>
            <div class="option-label">Lowercase</div>
            <div class="option-chars">a–z</div>
          </div>
        </div>
        <div class="option-item active" id="opt-numbers" onclick="toggleOpt('numbers')">
          <div class="option-check">✓</div>
          <div>
            <div class="option-label">Numbers</div>
            <div class="option-chars">0–9</div>
          </div>
        </div>
        <div class="option-item active" id="opt-symbols" onclick="toggleOpt('symbols')">
          <div class="option-check">✓</div>
          <div>
            <div class="option-label">Symbols</div>
            <div class="option-chars">!@#$%^&*</div>
          </div>
        </div>
        <div class="option-item" id="opt-ambiguous" onclick="toggleOpt('ambiguous')">
          <div class="option-check"></div>
          <div>
            <div class="option-label">Exclude Similar</div>
            <div class="option-chars">Il1O0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Passphrase options -->
    <div id="opts-passphrase" style="display:none">
      <div class="length-row">
        <div class="length-header">
          <span class="section-title">Words</span>
          <span class="length-val" id="wordVal">4</span>
        </div>
        <input type="range" class="length-slider" id="wordSlider" min="2" max="8" value="4" oninput="document.getElementById('wordVal').textContent=this.value;generate()"/>
      </div>
      <div class="separator-row">
        <label>Separator</label>
        <input type="text" class="sep-input" id="sepInput" value="-" maxlength="3" oninput="generate()"/>
      </div>
    </div>

    <!-- PIN options -->
    <div id="opts-pin" style="display:none">
      <div class="length-row">
        <div class="length-header">
          <span class="section-title">Digits</span>
          <span class="length-val" id="pinVal">6</span>
        </div>
        <input type="range" class="length-slider" id="pinSlider" min="4" max="12" value="6" oninput="document.getElementById('pinVal').textContent=this.value;generate()"/>
      </div>
    </div>
  </div>

  <!-- History -->
  <div class="history-card">
    <div class="history-header">
      <span class="section-title">Recent</span>
      <button class="clear-history" onclick="clearHistory()">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">No passwords generated yet</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// WORDLIST (simple common words for passphrase)
// ============================================================
const WORDS = [
  'apple','bridge','castle','dragon','engine','forest','garden','harbor',
  'island','jungle','kitten','lantern','mountain','nebula','ocean','planet',
  'river','shadow','thunder','umbrella','valley','winter','yellow','zenith',
  'anchor','blaze','coral','dusk','ember','frost','ghost','honey',
  'ivory','jasper','lunar','maple','noble','orbit','pearl','quest',
  'raven','silver','tiger','ultra','vivid','walnut','xenon','yacht',
  'azure','brave','cliff','denim','eagle','flame','grace','heron',
  'indigo','jewel','karma','lemon','magic','north','olive','prism',
  'quartz','robin','storm','topaz','unity','venom','witch','xenith',
  'amber','bliss','crane','daisy','eden','flint','globe','haven',
  'irony','joker','knoll','lapis','mirth','nexus','onyx','pixel',
  'quill','ridge','sphinx','thorn','ultra','vapor','weave','xeric'
];

const CHARS = {
  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower: 'abcdefghijklmnopqrstuvwxyz',
  numbers: '0123456789',
  symbols: '!@#$%^&*()-_=+[]{}|;:,.<>?',
  ambiguous: 'Il1O0',
};

let mode = 'random';
let opts = { upper: true, lower: true, numbers: true, symbols: true, ambiguous: false };
let history = [];
let currentPw = '';

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  generate();
});

// ============================================================
// MODE
// ============================================================
function setMode(m) {
  mode = m;
  ['random','passphrase','pin'].forEach(id => {
    document.getElementById('mode-' + id).classList.toggle('active', id === m);
    document.getElementById('opts-' + id).style.display = id === m ? 'block' : 'none';
  });
  generate();
}

// ============================================================
// OPTIONS
// ============================================================
function toggleOpt(key) {
  // Must keep at least one active
  const active = Object.entries(opts).filter(([k,v]) => v && k !== 'ambiguous').length;
  if (opts[key] && active <= 1 && key !== 'ambiguous') { showToast('Keep at least one charset!'); return; }
  opts[key] = !opts[key];
  const el = document.getElementById('opt-' + key);
  el.classList.toggle('active', opts[key]);
  el.querySelector('.option-check').textContent = opts[key] ? '✓' : '';
  generate();
}

function onLenChange() {
  const v = document.getElementById('lenSlider').value;
  document.getElementById('lenVal').textContent = v;
  generate();
}

// ============================================================
// GENERATE
// ============================================================
function generate() {
  let pw = '';

  if (mode === 'random') {
    pw = generateRandom();
  } else if (mode === 'passphrase') {
    pw = generatePassphrase();
  } else {
    pw = generatePin();
  }

  currentPw = pw;
  document.getElementById('pwDisplay').textContent = pw;
  document.getElementById('copyBtn').classList.remove('copied');
  document.getElementById('copyBtn').textContent = '⎘ Copy';
  updateStrength(pw);
  addToHistory(pw);
}

function generateRandom() {
  let charset = '';
  if (opts.upper)   charset += CHARS.upper;
  if (opts.lower)   charset += CHARS.lower;
  if (opts.numbers) charset += CHARS.numbers;
  if (opts.symbols) charset += CHARS.symbols;
  if (opts.ambiguous) {
    CHARS.ambiguous.split('').forEach(c => { charset = charset.replace(new RegExp(c,'g'), ''); });
  }
  if (!charset) charset = CHARS.lower;

  const len = parseInt(document.getElementById('lenSlider').value);
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);

  // Guarantee at least one of each selected type
  let pw = Array.from(arr).map(n => charset[n % charset.length]).join('');

  // Inject required chars
  const required = [];
  if (opts.upper)   required.push(pickRandom(CHARS.upper));
  if (opts.lower)   required.push(pickRandom(CHARS.lower));
  if (opts.numbers) required.push(pickRandom(CHARS.numbers));
  if (opts.symbols) required.push(pickRandom(CHARS.symbols));

  const positions = shuffle([...Array(len).keys()]).slice(0, required.length);
  const pwArr = pw.split('');
  positions.forEach((pos, i) => { pwArr[pos] = required[i]; });
  return pwArr.join('');
}

function generatePassphrase() {
  const count = parseInt(document.getElementById('wordSlider').value);
  const sep = document.getElementById('sepInput').value || '-';
  const arr = new Uint32Array(count);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(n => WORDS[n % WORDS.length]).join(sep);
}

function generatePin() {
  const len = parseInt(document.getElementById('pinSlider').value);
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(n => n % 10).join('');
}

function pickRandom(str) {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return str[arr[0] % str.length];
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ============================================================
// STRENGTH
// ============================================================
function updateStrength(pw) {
  let score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (pw.length >= 16) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[a-z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  if (pw.length >= 20) score++;

  const level = score <= 2 ? 0 : score <= 4 ? 1 : score <= 6 ? 2 : 3;
  const colors = ['var(--red)', 'var(--red)', 'var(--yellow)', 'var(--green)'];
  const labels = ['Weak', 'Fair', 'Strong', 'Very Strong'];

  for (let i = 1; i <= 4; i++) {
    const bar = document.getElementById('sb' + i);
    bar.style.background = i <= level + 1 ? colors[level] : 'var(--border)';
  }
  const lbl = document.getElementById('strengthLabel');
  lbl.textContent = labels[level];
  lbl.style.color = colors[level];

  return level;
}

// ============================================================
// COPY
// ============================================================
function copyPassword() {
  if (!currentPw) return;
  navigator.clipboard.writeText(currentPw).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    showToast('Password copied!');
    setTimeout(() => { btn.textContent = '⎘ Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ============================================================
// HISTORY
// ============================================================
function addToHistory(pw) {
  if (!pw || pw === 'Click Generate to create a password') return;
  history.unshift({ pw, strength: updateStrength(pw) });
  if (history.length > 10) history.pop();
  renderHistory();
}

function clearHistory() { history = []; renderHistory(); }

function renderHistory() {
  const list = document.getElementById('historyList');
  if (!history.length) {
    list.innerHTML = '<div class="history-empty">No passwords generated yet</div>';
    return;
  }
  const colors = ['var(--red)','var(--yellow)','var(--green)','var(--green)'];
  list.innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="useHistory(${i})">
      <div class="history-strength" style="background:${colors[h.strength]}"></div>
      <div class="history-pw">${h.pw}</div>
      <button class="history-copy" onclick="event.stopPropagation();copyText('${h.pw}')">⎘</button>
    </div>
  `).join('');
}

function useHistory(i) {
  currentPw = history[i].pw;
  document.getElementById('pwDisplay').textContent = currentPw;
  updateStrength(currentPw);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
}

// ============================================================
// TOAST
// ============================================================
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
