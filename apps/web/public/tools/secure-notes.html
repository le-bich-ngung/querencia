<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Secure Notes - Querencia Tools</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{--sage:#4a7c59;--sage-light:#6fa882;--sage-pale:#ddeee3;--sage-dark:#2f5c3e;--bg:#f7faf8;--card:#fff;--border:#e0ece5;--text:#1a2e22;--muted:#6b8a74;--font-display:'Syne',sans-serif;--font-mono:'DM Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-mono);background:var(--bg);color:var(--text);min-height:100vh;padding:32px 16px}
  .container{max-width:820px;margin:0 auto}
  .header{margin-bottom:28px}
  .header h1{font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:var(--sage-dark)}
  .header p{font-size:0.8rem;color:var(--muted);margin-top:4px}
  .layout{display:grid;grid-template-columns:240px 1fr;gap:16px;min-height:70vh}
  @media(max-width:600px){.layout{grid-template-columns:1fr}}
  .sidebar{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;height:fit-content}
  .sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .sidebar-title{font-family:var(--font-display);font-size:0.82rem;font-weight:700;color:var(--text)}
  .btn-new{background:var(--sage);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:0.75rem;cursor:pointer;font-family:var(--font-display);font-weight:700;transition:background 0.18s}
  .btn-new:hover{background:var(--sage-dark)}
  .note-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
  .note-item:hover{background:var(--bg)}
  .note-item.active{background:var(--sage-pale)}
  .note-item:last-child{border-bottom:none}
  .note-title-preview{font-size:0.82rem;font-weight:600;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note-date{font-size:0.7rem;color:var(--muted)}
  .note-locked{float:right;font-size:0.8rem}
  .editor{background:var(--card);border:1.5px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .editor-toolbar{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .title-input{flex:1;border:none;outline:none;font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--text);background:transparent}
  .title-input::placeholder{color:var(--muted)}
  .btn-lock{background:transparent;border:1.5px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 12px;font-size:0.78rem;cursor:pointer;transition:all 0.18s;font-family:var(--font-mono);display:flex;align-items:center;gap:6px}
  .btn-lock:hover{border-color:var(--sage);color:var(--sage)}
  .btn-delete{background:transparent;border:none;color:#ddd;cursor:pointer;font-size:1rem;padding:4px;transition:color 0.18s}
  .btn-delete:hover{color:#c0392b}
  .content-area{flex:1;padding:18px;display:flex;flex-direction:column;gap:0}
  textarea{flex:1;min-height:300px;border:none;outline:none;font-family:var(--font-mono);font-size:0.88rem;line-height:1.8;color:var(--text);background:transparent;resize:none}
  .status-bar{padding:10px 18px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:0.72rem;color:var(--muted)}
  .status-saved{color:var(--sage-light)}
  /* Lock screen */
  .lock-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:14px}
  .lock-icon{font-size:2.5rem}
  .lock-title{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--text)}
  .lock-desc{font-size:0.8rem;color:var(--muted);text-align:center}
  .pass-input{width:100%;max-width:280px;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--font-mono);font-size:0.9rem;outline:none;text-align:center;transition:border-color 0.2s}
  .pass-input:focus{border-color:var(--sage)}
  .btn-unlock{background:var(--sage);color:#fff;border:none;border-radius:10px;padding:11px 28px;font-family:var(--font-display);font-weight:700;font-size:0.9rem;cursor:pointer;transition:background 0.18s}
  .btn-unlock:hover{background:var(--sage-dark)}
  .pass-error{color:#c0392b;font-size:0.8rem}
  .empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.85rem;flex-direction:column;gap:10px;padding:48px}
  .empty-state .big{font-size:2.5rem;opacity:0.3}
  .sidebar-empty{padding:20px 16px;font-size:0.8rem;color:var(--muted);text-align:center}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔐 Secure Notes</h1>
    <p>AES-256 encrypted notes. Never saved to a server - only in your browser. Optionally lock with a password.</p>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">My notes</span>
        <button class="btn-new" onclick="newNote()">+ New</button>
      </div>
      <div id="noteList"><div class="sidebar-empty">No notes yet</div></div>
    </div>

    <div class="editor" id="editor">
      <div class="empty-state">
        <div class="big">📝</div>
        <div>Select or create a new note</div>
      </div>
    </div>
  </div>
</div>

<script>
// AES-GCM encryption using Web Crypto API
async function encrypt(text, password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt']
  );
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(text));
  const result = new Uint8Array(salt.byteLength + iv.byteLength + data.byteLength);
  result.set(salt, 0); result.set(iv, 16); result.set(new Uint8Array(data), 28);
  return btoa(String.fromCharCode(...result));
}

async function decrypt(cipherB64, password) {
  try {
    const bytes = Uint8Array.from(atob(cipherB64), c => c.charCodeAt(0));
    const salt = bytes.slice(0,16), iv = bytes.slice(16,28), data = bytes.slice(28);
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'},
      keyMaterial, {name:'AES-GCM', length:256}, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
    return new TextDecoder().decode(plain);
  } catch { return null; }
}

// State
let notes = JSON.parse(localStorage.getItem('qr_secure_notes') || '[]');
let currentId = null;
let saveTimer = null;

function save() { localStorage.setItem('qr_secure_notes', JSON.stringify(notes)); }

function newNote() {
  const id = Date.now().toString();
  notes.unshift({id, title:'New note', content:'', locked:false, cipher:null, updated: Date.now()});
  save();
  renderList();
  openNote(id);
}

function renderList() {
  const list = document.getElementById('noteList');
  if (!notes.length) { list.innerHTML = '<div class="sidebar-empty">No notes yet</div>'; return; }
  list.innerHTML = notes.map(n => `
    <div class="note-item${n.id===currentId?' active':''}" onclick="openNote('${n.id}')">
      <span class="note-locked">${n.locked ? '🔒' : ''}</span>
      <div class="note-title-preview">${n.title||'Untitled'}</div>
      <div class="note-date">${new Date(n.updated).toLocaleDateString('en-US')}</div>
    </div>
  `).join('');
}

function openNote(id) {
  currentId = id;
  renderList();
  const note = notes.find(n => n.id === id);
  if (!note) return;

  if (note.locked) {
    showLockScreen(note);
  } else {
    showEditor(note);
  }
}

function showEditor(note) {
  document.getElementById('editor').innerHTML = `
    <div class="editor-toolbar">
      <input class="title-input" id="noteTitle" value="${note.title||''}" placeholder="Title..." oninput="updateTitle(this.value)"/>
      <button class="btn-lock" onclick="toggleLock('${note.id}')">${note.locked?'🔓 Unlock':'🔒 Lock'}</button>
      <button class="btn-delete" onclick="deleteNote('${note.id}')" title="Delete">🗑</button>
    </div>
    <div class="content-area">
      <textarea id="noteBody" placeholder="Start writing..." oninput="updateContent(this.value)">${note.content||''}</textarea>
    </div>
    <div class="status-bar">
      <span id="charCount">${(note.content||'').length} characters</span>
      <span class="status-saved" id="saveStatus">✓ Saved</span>
    </div>
  `;
}

function showLockScreen(note) {
  document.getElementById('editor').innerHTML = `
    <div class="lock-screen">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">${note.title}</div>
      <div class="lock-desc">This note is encrypted.<br/>Enter the password to unlock.</div>
      <input class="pass-input" type="password" id="unlockPass" placeholder="Password..." onkeydown="if(event.key==='Enter')unlockNote('${note.id}')"/>
      <button class="btn-unlock" onclick="unlockNote('${note.id}')">Unlock</button>
      <div class="pass-error" id="unlockError"></div>
    </div>
  `;
}

async function toggleLock(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  if (!note.locked) {
    // Lock - ask for password
    const pass = prompt('Set a password for this note:');
    if (!pass) return;
    note.cipher = await encrypt(note.content, pass);
    note.content = '';
    note.locked = true;
    save();
    renderList();
    showLockScreen(note);
  } else {
    // Unlock handled by unlockNote
  }
}

async function unlockNote(id) {
  const note = notes.find(n => n.id === id);
  const pass = document.getElementById('unlockPass')?.value;
  if (!pass) return;
  const plain = await decrypt(note.cipher, pass);
  if (plain === null) {
    document.getElementById('unlockError').textContent = '❌ Wrong password';
    return;
  }
  note.content = plain;
  note.locked = false;
  note.cipher = null;
  save();
  renderList();
  showEditor(note);
}

function updateTitle(val) {
  const note = notes.find(n => n.id === currentId);
  if (!note) return;
  note.title = val;
  note.updated = Date.now();
  scheduleSave();
}

function updateContent(val) {
  const note = notes.find(n => n.id === currentId);
  if (!note) return;
  note.content = val;
  note.updated = Date.now();
  document.getElementById('charCount').textContent = val.length + ' characters';
  document.getElementById('saveStatus').textContent = '...';
  scheduleSave();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    save();
    renderList();
    const s = document.getElementById('saveStatus');
    if (s) { s.textContent = '✓ Saved'; }
  }, 600);
}

function deleteNote(id) {
  if (!confirm('Delete this note?')) return;
  notes = notes.filter(n => n.id !== id);
  currentId = null;
  save();
  renderList();
  document.getElementById('editor').innerHTML = `
    <div class="empty-state"><div class="big">📝</div><div>Select or create a new note</div></div>
  `;
}

renderList();
</script>
</body>
</html>
